name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install
        run: npm ci && (cd client && npm ci)

      - name: Cache hadith source editions
        uses: actions/cache@v4
        with:
          path: .cache/hadith-api
          key: hadith-api-editions-v1

      - name: Build dataset (isnad graphs, narrators, transmissions)
        run: node server/scripts/build-dataset.js

      - name: Build client (static data mode)
        env:
          VITE_STATIC_DATA: "1"
          VITE_BASE: ${{ vars.SITE_BASE || '/sama-hadith/' }}
        run: cd client && npm run build

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
