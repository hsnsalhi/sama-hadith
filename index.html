<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سماء الحديث</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root {
  --gold:#c9a84c;--gold2:#f0d080;--gold3:#8a6a20;
  --sahabi:#f5d77a;--tabii:#7ab8f5;--muhaddith:#c07af5;--rijal:#7af5c0;
  --bg:#010610;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'Cairo',sans-serif;}
#c{position:fixed;inset:0;z-index:0;cursor:grab;}
#c:active{cursor:grabbing;}

/* HEADER */
#hdr{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:linear-gradient(to bottom,rgba(1,6,16,.95) 60%,transparent);}
#hdr h1{font-family:'Amiri',serif;font-size:26px;color:var(--gold);letter-spacing:2px;text-shadow:0 0 24px rgba(201,168,76,.5);}
#hdr p{font-size:10px;color:rgba(201,168,76,.35);letter-spacing:3px;margin-top:1px;}
.hstat{text-align:center;margin-left:20px;}
.hstat-v{font-size:17px;font-weight:600;color:var(--gold);}
.hstat-l{font-size:9px;color:rgba(201,168,76,.35);}

/* SEARCH */
#sw{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:25;width:300px;}
#si{width:100%;padding:9px 16px;background:rgba(1,9,22,.9);border:0.5px solid rgba(201,168,76,.25);border-radius:22px;color:var(--gold);font-family:'Cairo',sans-serif;font-size:13px;outline:none;text-align:center;direction:rtl;backdrop-filter:blur(12px);}
#si::placeholder{color:rgba(201,168,76,.3);}
#si:focus{border-color:rgba(201,168,76,.5);}
#sr{margin-top:6px;background:rgba(1,9,22,.96);border:0.5px solid rgba(201,168,76,.2);border-radius:12px;overflow:hidden;display:none;backdrop-filter:blur(12px);}
.sri{padding:9px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;}
.sri:hover{background:rgba(201,168,76,.07);}
.sri-n{font-family:'Amiri',serif;font-size:14px;color:var(--gold);}
.sri-g{font-size:10px;padding:2px 8px;border-radius:10px;}

/* ZOOM CONTROLS */
#zoom-ctrl{position:fixed;left:20px;top:50%;transform:translateY(-50%);z-index:20;display:flex;flex-direction:column;gap:6px;}
.zb{width:36px;height:36px;border-radius:8px;background:rgba(1,9,22,.85);border:0.5px solid rgba(201,168,76,.22);color:var(--gold);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;backdrop-filter:blur(8px);}
.zb:hover{background:rgba(201,168,76,.12);border-color:rgba(201,168,76,.45);}
#zoom-val{font-size:10px;color:rgba(201,168,76,.4);text-align:center;font-family:'Cairo',sans-serif;}

/* PANEL */
#panel{position:fixed;right:0;top:0;bottom:0;width:340px;z-index:30;background:rgba(1,6,16,.97);border-left:0.5px solid rgba(201,168,76,.15);transform:translateX(100%);transition:transform .4s cubic-bezier(.16,1,.3,1);backdrop-filter:blur(20px);display:flex;flex-direction:column;overflow:hidden;}
#panel.open{transform:translateX(0);}
#pcl{position:absolute;top:14px;right:14px;width:28px;height:28px;border-radius:50%;background:rgba(201,168,76,.07);border:0.5px solid rgba(201,168,76,.2);color:var(--gold);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
#pcl:hover{background:rgba(201,168,76,.15);}
#ph{padding:24px 22px 18px;border-bottom:0.5px solid rgba(201,168,76,.08);flex-shrink:0;}
.pdot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-left:7px;}
#pg{font-size:11px;color:rgba(201,168,76,.4);margin-bottom:7px;display:flex;align-items:center;}
#pn{font-family:'Amiri',serif;font-size:24px;color:var(--gold);line-height:1.2;margin-bottom:3px;}
#pl{font-size:11px;color:rgba(201,168,76,.35);}
#pb{flex:1;overflow-y:auto;padding:18px 22px;}
#pb::-webkit-scrollbar{width:2px;}
#pb::-webkit-scrollbar-thumb{background:rgba(201,168,76,.15);border-radius:1px;}
.ir{display:flex;justify-content:space-between;padding:7px 0;border-bottom:0.5px solid rgba(201,168,76,.05);}
.il{font-size:11px;color:rgba(201,168,76,.38);}
.iv{font-size:12px;color:rgba(201,168,76,.8);text-align:left;max-width:180px;}
.ps{margin-top:18px;}
.pst{font-size:10px;letter-spacing:2px;color:rgba(201,168,76,.25);margin-bottom:8px;text-transform:uppercase;}
.tag{display:inline-block;padding:3px 9px;border-radius:10px;font-size:11px;margin:2px;}
.tc{background:rgba(201,168,76,.06);border:0.5px solid rgba(201,168,76,.18);color:rgba(201,168,76,.75);}
.tr{background:rgba(122,245,192,.06);border:0.5px solid rgba(122,245,192,.18);color:#7af5c0;}
.pl-item{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;cursor:pointer;transition:background .15s;margin-bottom:3px;}
.pl-item:hover{background:rgba(201,168,76,.05);}
.pl-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.pl-name{font-family:'Amiri',serif;font-size:14px;color:rgba(201,168,76,.82);}
.pl-era{font-size:10px;color:rgba(201,168,76,.3);margin-right:auto;}
.hc{background:rgba(201,168,76,.04);border:0.5px solid rgba(201,168,76,.09);border-radius:7px;padding:11px;margin-bottom:7px;}
.ht{font-family:'Amiri',serif;font-size:14px;color:rgba(201,168,76,.82);line-height:1.8;direction:rtl;}
.hm{font-size:10px;color:rgba(201,168,76,.3);margin-top:5px;}

/* LEGEND */
#leg{position:fixed;left:20px;bottom:68px;z-index:20;background:rgba(1,9,22,.82);border:0.5px solid rgba(201,168,76,.1);border-radius:10px;padding:11px 13px;backdrop-filter:blur(8px);}
.li{display:flex;align-items:center;gap:7px;margin-bottom:5px;}
.li:last-child{margin-bottom:0;}
.ld{width:7px;height:7px;border-radius:50%;}
.ll{font-size:11px;color:rgba(201,168,76,.5);}

/* BOTTOM BAR */
#bot{position:fixed;bottom:0;left:0;right:0;z-index:20;padding:10px 24px;background:linear-gradient(to top,rgba(1,6,16,.95) 60%,transparent);display:flex;align-items:center;justify-content:center;gap:6px;}
.cb{padding:6px 14px;border-radius:18px;background:rgba(1,9,22,.85);border:0.5px solid rgba(201,168,76,.2);color:rgba(201,168,76,.65);font-family:'Cairo',sans-serif;font-size:11px;cursor:pointer;transition:all .2s;backdrop-filter:blur(8px);}
.cb:hover,.cb.on{background:rgba(201,168,76,.1);border-color:rgba(201,168,76,.4);color:var(--gold);}
.csep{width:1px;height:16px;background:rgba(201,168,76,.12);}

/* TIMELINE */
#tl{position:fixed;bottom:46px;left:50%;transform:translateX(-50%);z-index:15;width:72%;max-width:860px;pointer-events:none;}
.tll{height:1px;background:linear-gradient(to right,transparent,rgba(201,168,76,.18) 15%,rgba(201,168,76,.18) 85%,transparent);margin-bottom:5px;}
.tls{display:flex;justify-content:space-between;}
.tlb{font-size:9px;color:rgba(201,168,76,.25);}

/* LOADING */
#ld{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s;}
#ld h2{font-family:'Amiri',serif;font-size:38px;color:var(--gold);margin-bottom:6px;text-shadow:0 0 30px rgba(201,168,76,.4);}
#ld p{font-size:11px;color:rgba(201,168,76,.35);letter-spacing:3px;margin-bottom:28px;}
.lbw{width:180px;height:2px;background:rgba(201,168,76,.08);border-radius:1px;overflow:hidden;}
.lbf{height:100%;background:var(--gold);border-radius:1px;width:0%;transition:width .3s;}
#lst{font-size:11px;color:rgba(201,168,76,.28);margin-top:10px;}

/* HINT */
#hint{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);z-index:5;text-align:center;pointer-events:none;transition:opacity 1.5s;}
#hint p{font-size:11px;color:rgba(201,168,76,.22);letter-spacing:1px;}

/* TOOLTIP */
#tt{position:fixed;z-index:25;background:rgba(1,9,22,.92);border:0.5px solid rgba(201,168,76,.22);border-radius:8px;padding:8px 12px;pointer-events:none;display:none;backdrop-filter:blur(10px);}
#tt-n{font-family:'Amiri',serif;font-size:14px;color:var(--gold);}
#tt-s{font-size:10px;color:rgba(201,168,76,.45);margin-top:2px;}
</style>
</head>
<body>

<div id="ld">
  <h2>سماء الحديث</h2>
  <p>SAMA AL-HADITH</p>
  <div class="lbw"><div class="lbf" id="lbf"></div></div>
  <div id="lst">جارٍ التحميل...</div>
</div>

<canvas id="c"></canvas>

<div id="hdr">
  <div>
    <h1>سماء الحديث</h1>
    <p>SAMA AL-HADITH · L'UNIVERS DES NARRATEURS</p>
  </div>
  <div style="display:flex;">
    <div class="hstat"><div class="hstat-v" id="stn">—</div><div class="hstat-l">ناقل</div></div>
    <div class="hstat"><div class="hstat-v" id="stl">—</div><div class="hstat-l">سند</div></div>
    <div class="hstat"><div class="hstat-v" id="sth">—</div><div class="hstat-l">حديث</div></div>
  </div>
</div>

<div id="sw">
  <input id="si" type="text" placeholder="ابحث عن راوٍ..." autocomplete="off">
  <div id="sr"></div>
</div>

<div id="zoom-ctrl">
  <button class="zb" onclick="zoomIn()" title="تكبير">+</button>
  <div id="zoom-val">100%</div>
  <button class="zb" onclick="zoomOut()" title="تصغير">−</button>
  <button class="zb" onclick="resetView()" title="إعادة" style="font-size:13px;margin-top:4px;">↺</button>
</div>

<div id="panel">
  <div id="pcl" onclick="closePanel()">✕</div>
  <div id="ph">
    <div id="pg"><span class="pdot" id="pdot"></span><span id="pgt"></span></div>
    <div id="pn"></div>
    <div id="pl"></div>
  </div>
  <div id="pb"></div>
</div>

<div id="leg">
  <div class="li"><div class="ld" style="background:var(--sahabi);box-shadow:0 0 6px var(--sahabi)"></div><span class="ll">الصحابة</span></div>
  <div class="li"><div class="ld" style="background:var(--tabii);box-shadow:0 0 6px var(--tabii)"></div><span class="ll">التابعون</span></div>
  <div class="li"><div class="ld" style="background:var(--muhaddith);box-shadow:0 0 6px var(--muhaddith)"></div><span class="ll">المحدثون</span></div>
  <div class="li"><div class="ld" style="background:var(--rijal);box-shadow:0 0 6px var(--rijal)"></div><span class="ll">علماء الرجال</span></div>
</div>

<div id="bot">
  <button class="cb on" id="ba" onclick="setF('all')">الكل</button>
  <div class="csep"></div>
  <button class="cb" id="bs" onclick="setF('sahabi')">الصحابة</button>
  <button class="cb" id="bt" onclick="setF('tabii')">التابعون</button>
  <button class="cb" id="bm" onclick="setF('muhaddith')">المحدثون</button>
  <button class="cb" id="br" onclick="setF('rijal')">علماء الرجال</button>
</div>

<div id="tl">
  <div class="tll"></div>
  <div class="tls">
    <span class="tlb">1 هـ</span><span class="tlb">100 هـ</span><span class="tlb">200 هـ</span>
    <span class="tlb">300 هـ</span><span class="tlb">400 هـ</span><span class="tlb">600 هـ</span><span class="tlb">900 هـ</span>
  </div>
</div>

<div id="hint"><p>اسحب للتنقل · عجلة الفأرة أو قرصة للتكبير · انقر على نجمة للتفاصيل</p></div>

<div id="tt"><div id="tt-n"></div><div id="tt-s"></div></div>

<script>
const SB_URL='https://kiqzfwyzekduitxghwaa.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtpcXpmd3l6ZWtkdWl0eGdod2FhIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3NDQ0MzYxOSwiZXhwIjoyMDkwMDE5NjE5fQ.BQSVuoh62aDcSGYyKKQkfrie6BZFL-dpiunYvflyjLA';

const GC={sahabi:'#f5d77a',tabii:'#7ab8f5',muhaddith:'#c07af5',rijal:'#7af5c0'};
const GL={sahabi:'صحابي',tabii:'تابعي',muhaddith:'محدّث',rijal:'ناقد رجال'};

let narrators=[],transmissions=[],hadiths=[];
let selId=null,hovId=null,filter='all';
let camX=0,camY=0,zoom=1;
let dragging=false,dragSX=0,dragSY=0,camSX=0,camSY=0;
let af=0,bgS=[],W=0,H=0,dpr=1;
let hintOn=true;
// Pinch
let pinchDist=0;

const cv=document.getElementById('c');
const ctx=cv.getContext('2d');

const ERA_MIN=1,ERA_MAX=950;
const WORLD_W=8000,WORLD_H=3000;

// ── Data ──────────────────────────────────────────────────────────────────────
async function sbGet(t,q=''){
  const r=await fetch(`${SB_URL}/rest/v1/${t}?${q}`,{headers:{'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`}});
  return r.json();
}
function setLS(m,p){document.getElementById('lst').textContent=m;document.getElementById('lbf').style.width=p+'%';}

async function loadData(){
  setLS('تحميل الرواة...',20);
  narrators=await sbGet('narrators','select=*&order=death_ah.asc&limit=500');
  setLS('تحميل الأسانيد...',55);
  transmissions=await sbGet('transmissions','select=*&limit=2000');
  setLS('تحميل الأحاديث...',80);
  hadiths=await sbGet('hadiths','select=*&limit=1000');
  setLS('بناء الكون...',95);
  document.getElementById('stn').textContent=narrators.length;
  document.getElementById('stl').textContent=transmissions.length;
  document.getElementById('sth').textContent=hadiths.length;
  await new Promise(r=>setTimeout(r,500));
  setLS('جاهز',100);
  await new Promise(r=>setTimeout(r,400));
  const ld=document.getElementById('ld');
  ld.style.opacity='0';
  setTimeout(()=>ld.style.display='none',900);
}

// ── World coordinates ─────────────────────────────────────────────────────────
function worldX(n){
  return 200+((( n.death_ah||1)-ERA_MIN)/(ERA_MAX-ERA_MIN))*(WORLD_W-400);
}
function worldY(n){
  // Deterministic y with vertical spread
  const seed=(n.id*2654435761)>>>0;
  const norm=(seed%10000)/10000; // 0..1
  // Band height grows with zoom to spread more when zoomed in
  return WORLD_H*0.15 + norm*(WORLD_H*0.7);
}
function toScreen(wx,wy){
  return {
    x:(wx-camX)*zoom+W/2,
    y:(wy-camY)*zoom+H/2
  };
}
function toWorld(sx,sy){
  return {
    x:(sx-W/2)/zoom+camX,
    y:(sy-H/2)/zoom+camY
  };
}

// ── Star radius ───────────────────────────────────────────────────────────────
function baseR(n){
  if(n.generation==='sahabi') return 7;
  if(n.hadith_count>10000) return 8;
  if(n.hadith_count>3000) return 6;
  if(n.hadith_count>800) return 5;
  return 4;
}

// ── Realistic star rendering ──────────────────────────────────────────────────
function drawStar(x,y,r,col,isHov,isSel,alpha){
  const pulse=isHov?1+Math.sin(af*0.09)*0.18:1;
  const ar=r*pulse;

  // === Layer 1 : diffuse large halo (very soft) ===
  const haloR=ar*(isHov||isSel?14:9);
  const g1=ctx.createRadialGradient(x,y,0,x,y,haloR);
  g1.addColorStop(0,col+'18');
  g1.addColorStop(0.4,col+'08');
  g1.addColorStop(1,'rgba(0,0,0,0)');
  ctx.beginPath();ctx.arc(x,y,haloR,0,Math.PI*2);
  ctx.fillStyle=g1;ctx.fill();

  // === Layer 2 : mid glow ===
  const midR=ar*(isHov||isSel?6:4);
  const g2=ctx.createRadialGradient(x,y,0,x,y,midR);
  g2.addColorStop(0,col+'55');
  g2.addColorStop(0.5,col+'22');
  g2.addColorStop(1,'rgba(0,0,0,0)');
  ctx.beginPath();ctx.arc(x,y,midR,0,Math.PI*2);
  ctx.fillStyle=g2;ctx.fill();

  // === Layer 3 : bright core ===
  const coreR=ar*1.1;
  const g3=ctx.createRadialGradient(x,y,0,x,y,coreR);
  g3.addColorStop(0,'rgba(255,255,255,0.95)');
  g3.addColorStop(0.25,'rgba(255,255,255,0.7)');
  g3.addColorStop(0.55,col);
  g3.addColorStop(1,col+'00');
  ctx.beginPath();ctx.arc(x,y,coreR,0,Math.PI*2);
  ctx.fillStyle=g3;ctx.fill();

  // === Layer 4 : diffraction spikes (cross) ===
  const spikeLen=ar*(isHov||isSel?10:7);
  const spikeW=ar*0.18;
  ctx.save();
  ctx.globalAlpha=isHov||isSel?0.55:0.35;
  // Horizontal spike
  const sg1=ctx.createLinearGradient(x-spikeLen,y,x+spikeLen,y);
  sg1.addColorStop(0,'rgba(0,0,0,0)');sg1.addColorStop(0.4,col+'aa');
  sg1.addColorStop(0.5,'rgba(255,255,255,.9)');
  sg1.addColorStop(0.6,col+'aa');sg1.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=sg1;
  ctx.beginPath();ctx.ellipse(x,y,spikeLen,spikeW,0,0,Math.PI*2);ctx.fill();
  // Vertical spike
  const sg2=ctx.createLinearGradient(x,y-spikeLen,x,y+spikeLen);
  sg2.addColorStop(0,'rgba(0,0,0,0)');sg2.addColorStop(0.4,col+'aa');
  sg2.addColorStop(0.5,'rgba(255,255,255,.9)');
  sg2.addColorStop(0.6,col+'aa');sg2.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=sg2;
  ctx.beginPath();ctx.ellipse(x,y,spikeW,spikeLen,0,0,Math.PI*2);ctx.fill();
  // Diagonal spikes (fainter)
  ctx.globalAlpha=(isHov||isSel?0.3:0.18);
  const dl=spikeLen*0.65;
  const sg3=ctx.createLinearGradient(x-dl,y-dl,x+dl,y+dl);
  sg3.addColorStop(0,'rgba(0,0,0,0)');sg3.addColorStop(0.5,col+'88');sg3.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=sg3;
  ctx.beginPath();ctx.ellipse(x,y,dl,spikeW*.7,Math.PI/4,0,Math.PI*2);ctx.fill();
  const sg4=ctx.createLinearGradient(x-dl,y+dl,x+dl,y-dl);
  sg4.addColorStop(0,'rgba(0,0,0,0)');sg4.addColorStop(0.5,col+'88');sg4.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=sg4;
  ctx.beginPath();ctx.ellipse(x,y,dl,spikeW*.7,-Math.PI/4,0,Math.PI*2);ctx.fill();
  ctx.restore();

  // === Layer 5 : selection ring ===
  if(isSel){
    ctx.beginPath();ctx.arc(x,y,ar+5,0,Math.PI*2);
    ctx.strokeStyle=col+'99';ctx.lineWidth=1.2;ctx.stroke();
    ctx.beginPath();ctx.arc(x,y,ar+10,0,Math.PI*2);
    ctx.strokeStyle=col+'33';ctx.lineWidth=0.8;ctx.stroke();
  }
}

// ── Background stars ──────────────────────────────────────────────────────────
function genBg(){
  bgS=[];
  for(let i=0;i<500;i++){
    bgS.push({
      x:Math.random()*W,y:Math.random()*H,
      r:Math.random()*0.9+0.1,
      a:Math.random()*0.6+0.1,
      tw:Math.random()*Math.PI*2,
      sp:Math.random()*0.012+0.004,
      col:Math.random()<0.15?'#b8d4f5':(Math.random()<0.1?'#f5e0b8':'#e8e0d0')
    });
  }
}

// ── Draw ──────────────────────────────────────────────────────────────────────
function draw(){
  af++;
  ctx.clearRect(0,0,W,H);

  // Sky gradient
  const bg=ctx.createRadialGradient(W*.45,H*.4,0,W*.45,H*.4,W*.85);
  bg.addColorStop(0,'#03122e');
  bg.addColorStop(0.5,'#020a1c');
  bg.addColorStop(1,'#010610');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  // Milky-way band
  const mw=ctx.createLinearGradient(0,H*.25,0,H*.75);
  mw.addColorStop(0,'rgba(0,0,0,0)');
  mw.addColorStop(0.5,'rgba(20,40,80,0.18)');
  mw.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=mw;ctx.fillRect(0,0,W,H);

  // BG stars (fixed, no zoom)
  bgS.forEach(s=>{
    const a=Math.max(0,s.a+Math.sin(af*s.sp+s.tw)*0.1);
    const g=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r*2.5);
    g.addColorStop(0,s.col);
    g.addColorStop(0.4,s.col.slice(0,7)+'88');
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.globalAlpha=a;
    ctx.beginPath();ctx.arc(s.x,s.y,s.r*2.5,0,Math.PI*2);
    ctx.fillStyle=g;ctx.fill();
    ctx.beginPath();ctx.arc(s.x,s.y,s.r*.5,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,0.9)';ctx.fill();
    ctx.globalAlpha=1;
  });

  const vis=narrators.filter(n=>filter==='all'||n.generation===filter);

  // Transmission lines for selected
  if(selId){
    const sel=narrators.find(n=>n.id===selId);
    if(sel){
      const sp=toScreen(worldX(sel),worldY(sel));
      transmissions.forEach(t=>{
        let other=null;
        if(t.teacher_id===selId) other=narrators.find(n=>n.id===t.student_id);
        else if(t.student_id===selId) other=narrators.find(n=>n.id===t.teacher_id);
        if(!other) return;
        const op=toScreen(worldX(other),worldY(other));
        const col=GC[other.generation]||'#c9a84c';
        ctx.beginPath();
        ctx.moveTo(sp.x,sp.y);
        const cpx=sp.x+(op.x-sp.x)*0.5,cpy=sp.y;
        const cpx2=sp.x+(op.x-sp.x)*0.5,cpy2=op.y;
        ctx.bezierCurveTo(cpx,cpy,cpx2,cpy2,op.x,op.y);
        const grad=ctx.createLinearGradient(sp.x,sp.y,op.x,op.y);
        const isTch=t.student_id===selId;
        grad.addColorStop(0,isTch?col+'60':'#c9a84c60');
        grad.addColorStop(1,isTch?'#c9a84c18':col+'18');
        ctx.strokeStyle=grad;ctx.lineWidth=1;ctx.setLineDash([3,7]);ctx.stroke();
        ctx.setLineDash([]);
      });
    }
  }

  // Draw narrator stars
  vis.forEach(n=>{
    const {x,y}=toScreen(worldX(n),worldY(n));
    if(x<-80||x>W+80||y<-80||y>H+80) return;
    const r=baseR(n)*(0.7+zoom*0.15);
    const col=GC[n.generation]||'#c9a84c';
    const isHov=n.id===hovId,isSel=n.id===selId;
    ctx.globalAlpha=filter==='all'||n.generation===filter?1:0.2;
    drawStar(x,y,Math.max(2,Math.min(r,zoom>3?r:r)),col,isHov,isSel);
    ctx.globalAlpha=1;

    // Label — show when hovered, selected, or zoomed in enough
    const showLabel=isHov||isSel||(zoom>2.5);
    if(showLabel){
      const labelAlpha=isHov||isSel?1:Math.min(1,(zoom-2.5)*0.8);
      ctx.save();
      ctx.globalAlpha=labelAlpha;
      ctx.font=`500 ${Math.round(11+zoom*0.5)}px Amiri,serif`;
      ctx.textAlign='center';
      ctx.fillStyle=col;
      ctx.shadowColor=col;ctx.shadowBlur=6;
      ctx.fillText(n.name_ar,x,y-r*zoom*0.5-10);
      ctx.shadowBlur=0;
      if(zoom>1.8||isHov||isSel){
        ctx.font=`400 ${Math.round(9+zoom*0.3)}px Cairo,sans-serif`;
        ctx.fillStyle=col+'77';
        ctx.fillText((n.death_ah||'?')+' هـ',x,y-r*zoom*0.5-24);
      }
      ctx.restore();
    }
  });

  requestAnimationFrame(draw);
}

// ── Zoom ─────────────────────────────────────────────────────────────────────
function clampZoom(z){return Math.max(0.3,Math.min(8,z));}
function applyZoom(newZ,pivotSX,pivotSY){
  const pw=toWorld(pivotSX,pivotSY);
  zoom=clampZoom(newZ);
  // Keep pivot world point under same screen point
  camX=pw.x-(pivotSX-W/2)/zoom;
  camY=pw.y-(pivotSY-H/2)/zoom;
  document.getElementById('zoom-val').textContent=Math.round(zoom*100)+'%';
}
function zoomIn(){applyZoom(zoom*1.35,W/2,H/2);}
function zoomOut(){applyZoom(zoom/1.35,W/2,H/2);}

// ── Hit test ──────────────────────────────────────────────────────────────────
function getHit(sx,sy){
  const vis=narrators.filter(n=>filter==='all'||n.generation===filter);
  for(const n of [...vis].reverse()){
    const {x,y}=toScreen(worldX(n),worldY(n));
    const r=(baseR(n)+10)*Math.max(1,zoom*0.4);
    if((sx-x)**2+(sy-y)**2<r*r) return n;
  }
  return null;
}

// ── Interaction ───────────────────────────────────────────────────────────────
cv.addEventListener('mousedown',e=>{
  dragging=true;dragSX=e.clientX;dragSY=e.clientY;camSX=camX;camSY=camY;
  cv.style.cursor='grabbing';
});
window.addEventListener('mouseup',e=>{
  if(!dragging) return;
  const moved=Math.abs(e.clientX-dragSX)+Math.abs(e.clientY-dragSY);
  dragging=false;cv.style.cursor='grab';
  if(moved<5){
    const rect=cv.getBoundingClientRect();
    const hit=getHit(e.clientX-rect.left,e.clientY-rect.top);
    if(hit) openPanel(hit);
    else if(!document.getElementById('panel').contains(e.target)) closePanel();
  }
});
cv.addEventListener('mousemove',e=>{
  if(dragging){camX=camSX-(e.clientX-dragSX)/zoom;camY=camSY-(e.clientY-dragSY)/zoom;return;}
  const rect=cv.getBoundingClientRect();
  const hit=getHit(e.clientX-rect.left,e.clientY-rect.top);
  hovId=hit?hit.id:null;
  cv.style.cursor=hit?'pointer':'grab';
  const tt=document.getElementById('tt');
  if(hit){
    document.getElementById('tt-n').textContent=hit.name_ar;
    document.getElementById('tt-s').textContent=(hit.death_ah||'?')+' هـ · '+(GL[hit.generation]||hit.generation);
    tt.style.display='block';
    tt.style.left=(e.clientX+14)+'px';
    tt.style.top=(e.clientY-10)+'px';
  } else { tt.style.display='none'; }
});
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  const rect=cv.getBoundingClientRect();
  const factor=e.deltaY<0?1.12:0.89;
  applyZoom(zoom*factor,e.clientX-rect.left,e.clientY-rect.top);
},{passive:false});

// Pinch-to-zoom
cv.addEventListener('touchstart',e=>{
  if(e.touches.length===2){
    const dx=e.touches[0].clientX-e.touches[1].clientX;
    const dy=e.touches[0].clientY-e.touches[1].clientY;
    pinchDist=Math.hypot(dx,dy);
  } else {
    dragging=true;
    dragSX=e.touches[0].clientX;dragSY=e.touches[0].clientY;
    camSX=camX;camSY=camY;
  }
},{passive:true});
cv.addEventListener('touchmove',e=>{
  if(e.touches.length===2){
    const dx=e.touches[0].clientX-e.touches[1].clientX;
    const dy=e.touches[0].clientY-e.touches[1].clientY;
    const d=Math.hypot(dx,dy);
    const mx=(e.touches[0].clientX+e.touches[1].clientX)/2;
    const my=(e.touches[0].clientY+e.touches[1].clientY)/2;
    const rect=cv.getBoundingClientRect();
    applyZoom(zoom*(d/pinchDist),mx-rect.left,my-rect.top);
    pinchDist=d;
  } else if(dragging){
    camX=camSX-(e.touches[0].clientX-dragSX)/zoom;
    camY=camSY-(e.touches[0].clientY-dragSY)/zoom;
  }
},{passive:true});
cv.addEventListener('touchend',e=>{
  dragging=false;
  if(e.changedTouches.length===1 && e.touches.length===0){
    const dx=Math.abs(e.changedTouches[0].clientX-dragSX);
    const dy=Math.abs(e.changedTouches[0].clientY-dragSY);
    if(dx+dy<10){
      const rect=cv.getBoundingClientRect();
      const t=e.changedTouches[0];
      const hit=getHit(t.clientX-rect.left,t.clientY-rect.top);
      if(hit) openPanel(hit);
    }
  }
},{passive:true});

// ── Panel ─────────────────────────────────────────────────────────────────────
function openPanel(n){
  selId=n.id;
  if(hintOn){document.getElementById('hint').style.opacity='0';hintOn=false;}
  const col=GC[n.generation]||'#c9a84c';
  document.getElementById('pdot').style.cssText=`background:${col};box-shadow:0 0 7px ${col}`;
  document.getElementById('pgt').textContent=GL[n.generation]||n.generation;
  document.getElementById('pn').textContent=n.name_ar;
  document.getElementById('pl').textContent=n.name_latin||'';
  const colls=Array.isArray(n.collections)?n.collections:(n.collections?JSON.parse(n.collections):[]);
  const teachers=transmissions.filter(t=>t.student_id===n.id).map(t=>narrators.find(x=>x.id===t.teacher_id)).filter(Boolean);
  const students=transmissions.filter(t=>t.teacher_id===n.id).map(t=>narrators.find(x=>x.id===t.student_id)).filter(Boolean);
  const nh=hadiths.filter(h=>h.narrator_id===n.id);
  const pb=document.getElementById('pb');
  pb.innerHTML=`
    <div class="ir"><span class="il">وفاته</span><span class="iv">${n.death_ah?n.death_ah+' هـ':'غير معروف'}</span></div>
    <div class="ir"><span class="il">المنشأ</span><span class="iv">${n.origin||'—'}</span></div>
    <div class="ir"><span class="il">عدد الأحاديث</span><span class="iv">${(n.hadith_count||0).toLocaleString()}</span></div>
    <div class="ir"><span class="il">الحكم</span><span class="iv">${n.reliability||'—'}</span></div>
    ${colls.length?`<div class="ps"><div class="pst">المصادر</div>${colls.map(c=>`<span class="tag tc">${c}</span>`).join('')}</div>`:''}
    ${teachers.length?`<div class="ps"><div class="pst">شيوخه (${teachers.length})</div>${teachers.map(t=>`<div class="pl-item" onclick="jumpTo(${t.id})"><div class="pl-dot" style="background:${GC[t.generation]};box-shadow:0 0 4px ${GC[t.generation]}"></div><span class="pl-name">${t.name_ar}</span><span class="pl-era">${t.death_ah||''}هـ</span></div>`).join('')}</div>`:''}
    ${students.length?`<div class="ps"><div class="pst">تلاميذه (${students.length})</div>${students.map(s=>`<div class="pl-item" onclick="jumpTo(${s.id})"><div class="pl-dot" style="background:${GC[s.generation]};box-shadow:0 0 4px ${GC[s.generation]}"></div><span class="pl-name">${s.name_ar}</span><span class="pl-era">${s.death_ah||''}هـ</span></div>`).join('')}</div>`:''}
    ${nh.length?`<div class="ps"><div class="pst">أحاديثه</div>${nh.map(h=>`<div class="hc"><div class="ht">${h.text_ar}</div><div class="hm">${h.collection||''}${h.chapter?' · '+h.chapter:''}</div></div>`).join('')}</div>`:''}
  `;
  document.getElementById('panel').classList.add('open');
}
function closePanel(){document.getElementById('panel').classList.remove('open');selId=null;}
function jumpTo(id){const n=narrators.find(x=>x.id===id);if(n) openPanel(n);}

// ── Search ────────────────────────────────────────────────────────────────────
document.getElementById('si').addEventListener('input',function(){
  const q=this.value.trim();
  const sr=document.getElementById('sr');
  if(!q){sr.style.display='none';return;}
  const res=narrators.filter(n=>n.name_ar?.includes(q)||n.name_latin?.toLowerCase().includes(q.toLowerCase())).slice(0,8);
  if(!res.length){sr.style.display='none';return;}
  sr.innerHTML=res.map(n=>`<div class="sri" onclick="focusNarrator(${n.id})"><span class="sri-n">${n.name_ar}</span><span class="sri-g" style="background:${GC[n.generation]}18;color:${GC[n.generation]};border:0.5px solid ${GC[n.generation]}33">${GL[n.generation]||n.generation}</span></div>`).join('');
  sr.style.display='block';
});
document.addEventListener('click',e=>{
  if(!document.getElementById('sw').contains(e.target)) document.getElementById('sr').style.display='none';
});

function focusNarrator(id){
  const n=narrators.find(x=>x.id===id);
  if(!n) return;
  document.getElementById('sr').style.display='none';
  document.getElementById('si').value='';
  // Animate camera to narrator
  const tx=worldX(n),ty=worldY(n);
  const startX=camX,startY=camY,startZ=zoom;
  const targetZ=Math.max(2.5,zoom);
  let t=0;
  const anim=setInterval(()=>{
    t+=0.06;
    if(t>=1){t=1;clearInterval(anim);}
    const e=1-Math.pow(1-t,3);
    camX=startX+(tx-startX)*e;
    camY=startY+(ty-startY)*e;
    zoom=startZ+(targetZ-startZ)*e;
    document.getElementById('zoom-val').textContent=Math.round(zoom*100)+'%';
  },16);
  setTimeout(()=>openPanel(n),400);
}
function focusNarratorInstant(id){
  const n=narrators.find(x=>x.id===id);
  if(!n) return;
  camX=worldX(n); camY=worldY(n); zoom=Math.max(2.5,zoom);
  document.getElementById('zoom-val').textContent=Math.round(zoom*100)+'%';
  openPanel(n);
}

// ── Filter ────────────────────────────────────────────────────────────────────
function setF(f){
  filter=f;
  ['all','sahabi','tabii','muhaddith','rijal'].forEach(k=>{
    const b=document.getElementById('b'+k[0]+(k==='all'?'a':k==='sahabi'?'s':k==='tabii'?'t':k==='muhaddith'?'m':'r'));
    if(b) b.classList.toggle('on',k===f);
  });
}

// ── Reset ─────────────────────────────────────────────────────────────────────
function resetView(){
  camX=WORLD_W/2;camY=WORLD_H/2;zoom=1;
  document.getElementById('zoom-val').textContent='100%';
  closePanel();selId=null;hovId=null;
}

// ── Resize ────────────────────────────────────────────────────────────────────
function resize(){
  dpr=window.devicePixelRatio||1;
  W=window.innerWidth;H=window.innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;
  cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.scale(dpr,dpr);
  genBg();
}
window.addEventListener('resize',resize);
resize();

// Initial camera position
camX=WORLD_W*0.08; camY=WORLD_H/2;

// ── Boot ──────────────────────────────────────────────────────────────────────
draw();
loadData();
</script>
