<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سماء الحديث · ثلاثي الأبعاد</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#c9a84c;--gold2:#f0d080;--gold3:#6a4a10;
  --sahabi:#f5d77a;--tabii:#7ab8f5;--muhaddith:#c07af5;--rijal:#7af5c0;
  --bg:#000508;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);}
#c{position:fixed;inset:0;z-index:0;}

/* CSS2D labels */
.lbl{
  font-family:'Amiri',serif,'Traditional Arabic','Arial Unicode MS','Noto Naskh Arabic',serif;
  font-size:12px;color:var(--gold);
  pointer-events:none;white-space:nowrap;
  text-shadow:0 0 8px rgba(201,168,76,.8),0 0 20px rgba(201,168,76,.4);
  transition:opacity .3s;
  direction:rtl;
  unicode-bidi:isolate;
}
.lbl.era{font-family:'Cairo',sans-serif;font-size:9px;color:rgba(201,168,76,.45);}

/* HEADER */
#hdr{
  position:fixed;top:0;left:0;right:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 24px;
  background:linear-gradient(to bottom,rgba(0,5,8,.95) 50%,transparent);
  pointer-events:none;
}
#hdr-left{pointer-events:all;}
#hdr-left h1{font-family:'Amiri',serif;font-size:26px;color:var(--gold);letter-spacing:2px;text-shadow:0 0 20px rgba(201,168,76,.5);}
#hdr-left p{font-family:'Cairo',sans-serif;font-size:10px;color:rgba(201,168,76,.35);letter-spacing:3px;margin-top:1px;}
.hstat{text-align:center;margin-left:20px;pointer-events:all;}
.hv{font-family:'Cairo',sans-serif;font-size:17px;font-weight:600;color:var(--gold);}
.hl{font-family:'Cairo',sans-serif;font-size:9px;color:rgba(201,168,76,.35);}

/* SEARCH */
#sw{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:25;width:280px;}
#si{width:100%;padding:8px 16px;background:rgba(0,5,8,.88);border:0.5px solid rgba(201,168,76,.22);border-radius:22px;color:var(--gold);font-family:'Cairo',sans-serif;font-size:13px;outline:none;text-align:center;direction:rtl;backdrop-filter:blur(12px);}
#si::placeholder{color:rgba(201,168,76,.28);}
#si:focus{border-color:rgba(201,168,76,.5);}
#sr{margin-top:5px;background:rgba(0,5,8,.96);border:0.5px solid rgba(201,168,76,.18);border-radius:10px;overflow:hidden;display:none;backdrop-filter:blur(12px);max-height:300px;overflow-y:auto;}
.sri{padding:8px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.sri:hover{background:rgba(201,168,76,.06);}
.sri-n{font-family:'Amiri',serif;font-size:13px;color:var(--gold);}
.sri-g{font-size:9px;padding:2px 7px;border-radius:8px;flex-shrink:0;}

/* PANEL */
#panel{
  position:fixed;right:0;top:0;bottom:0;width:320px;z-index:30;
  background:rgba(0,5,8,.97);border-left:0.5px solid rgba(201,168,76,.12);
  transform:translateX(100%);transition:transform .4s cubic-bezier(.16,1,.3,1);
  backdrop-filter:blur(20px);display:flex;flex-direction:column;
}
#panel.open{transform:translateX(0);}
#pcl{position:absolute;top:12px;right:12px;width:26px;height:26px;border-radius:50%;background:rgba(201,168,76,.06);border:0.5px solid rgba(201,168,76,.18);color:var(--gold);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
#pcl:hover{background:rgba(201,168,76,.14);}
#ph{padding:22px 20px 16px;border-bottom:0.5px solid rgba(201,168,76,.07);flex-shrink:0;}
.pdot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-left:6px;}
#pg{font-size:11px;color:rgba(201,168,76,.38);margin-bottom:6px;display:flex;align-items:center;}
#pn{font-family:'Amiri',serif;font-size:22px;color:var(--gold);line-height:1.2;margin-bottom:3px;}
#pl{font-size:11px;color:rgba(201,168,76,.32);}
#pb{flex:1;overflow-y:auto;padding:16px 20px;}
#pb::-webkit-scrollbar{width:2px;}
#pb::-webkit-scrollbar-thumb{background:rgba(201,168,76,.12);}
.ir{display:flex;justify-content:space-between;padding:6px 0;border-bottom:0.5px solid rgba(201,168,76,.05);}
.il{font-size:11px;color:rgba(201,168,76,.35);}
.iv{font-size:11px;color:rgba(201,168,76,.78);text-align:left;max-width:160px;}
.ps{margin-top:16px;}
.pst{font-size:9px;letter-spacing:2px;color:rgba(201,168,76,.22);margin-bottom:7px;text-transform:uppercase;}
.tag{display:inline-block;padding:2px 8px;border-radius:8px;font-size:10px;margin:2px;}
.tc{background:rgba(201,168,76,.05);border:0.5px solid rgba(201,168,76,.15);color:rgba(201,168,76,.7);}
.pl-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;transition:background .15s;margin-bottom:2px;}
.pl-item:hover{background:rgba(201,168,76,.04);}
.pl-d{width:5px;height:5px;border-radius:50%;flex-shrink:0;}
.pl-n{font-family:'Amiri',serif;font-size:13px;color:rgba(201,168,76,.8);}
.pl-e{font-size:9px;color:rgba(201,168,76,.28);margin-right:auto;}
.hc{background:rgba(201,168,76,.03);border:0.5px solid rgba(201,168,76,.08);border-radius:6px;padding:10px;margin-bottom:6px;}
.ht{font-family:'Amiri',serif;font-size:13px;color:rgba(201,168,76,.8);line-height:1.8;direction:rtl;}
.hm{font-size:9px;color:rgba(201,168,76,.28);margin-top:4px;}

/* LEGEND */
#leg{position:fixed;left:16px;bottom:130px;z-index:20;background:rgba(0,5,8,.8);border:0.5px solid rgba(201,168,76,.1);border-radius:8px;padding:10px 12px;backdrop-filter:blur(8px);}
.li{display:flex;align-items:center;gap:6px;margin-bottom:5px;}
.li:last-child{margin-bottom:0;}
.ld{width:6px;height:6px;border-radius:50%;}
.ll{font-family:'Cairo',sans-serif;font-size:10px;color:rgba(201,168,76,.45);}

/* GEO AXIS - repère vertical gauche */
#geo-axis{
  position:fixed;left:0;top:0;bottom:90px;
  width:90px;z-index:20;
  background:linear-gradient(to right,rgba(0,5,8,.92) 70%,transparent);
  pointer-events:none;
  display:flex;flex-direction:column;justify-content:stretch;
}
#geo-axis-title{
  position:absolute;top:50%;left:0;width:14px;
  transform:translateY(-50%);
  font-family:'Cairo',sans-serif;font-size:8px;
  color:rgba(201,168,76,.25);letter-spacing:2px;
  writing-mode:vertical-rl;text-orientation:mixed;
  transform:translateY(-50%) rotate(180deg);
}
#geo-track{
  position:absolute;top:5%;bottom:5%;left:56px;
  width:2px;background:rgba(201,168,76,.1);border-radius:1px;
}
/* Highlight sélectionné */
#geo-highlight{
  position:absolute;left:0;width:6px;
  transform:translateX(-2px);
  border-radius:3px;background:var(--gold);
  box-shadow:0 0 12px var(--gold),0 0 24px rgba(201,168,76,.4);
  opacity:0;transition:all .5s cubic-bezier(.16,1,.3,1);
}
/* Curseur survol */
#geo-cursor{
  position:absolute;left:-10px;right:-40px;height:1px;
  background:rgba(201,168,76,.2);pointer-events:none;
  opacity:0;transition:opacity .2s;
}
/* Labels des villes */
.geo-label{
  position:absolute;right:4px;
  font-family:'Cairo',sans-serif;font-size:9px;
  color:rgba(201,168,76,.4);
  white-space:nowrap;direction:rtl;
  transform:translateY(-50%);
  transition:color .2s;
}
.geo-label.active{color:rgba(201,168,76,.9)!important;}
.geo-label::after{
  content:'';position:absolute;left:calc(100% + 3px);top:50%;
  width:6px;height:1px;background:rgba(201,168,76,.15);
}
/* Dot sur la ligne verticale */
.geo-dot{
  position:absolute;left:50%;
  width:4px;height:4px;border-radius:50%;
  transform:translate(-50%,-50%);
  background:rgba(201,168,76,.3);
}
.geo-dot.major{width:6px;height:6px;background:rgba(201,168,76,.5);}


/* CONTROLS */
#ctrl{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:6px;align-items:center;}
.cb{padding:6px 13px;border-radius:16px;background:rgba(0,5,8,.85);border:0.5px solid rgba(201,168,76,.18);color:rgba(201,168,76,.6);font-family:'Cairo',sans-serif;font-size:10px;cursor:pointer;transition:all .2s;backdrop-filter:blur(8px);white-space:nowrap;}
.cb:hover,.cb.on{background:rgba(201,168,76,.1);border-color:rgba(201,168,76,.38);color:var(--gold);}
.csep{width:1px;height:14px;background:rgba(201,168,76,.1);}

/* TIMELINE */
#tl-wrap{
  position:fixed;bottom:0;left:0;right:0;z-index:20;
  background:linear-gradient(to top,rgba(0,5,8,.98) 60%,rgba(0,5,8,.0));
  padding:10px 70px 14px 70px;
  pointer-events:all;
}
#tl-hl-name{
  font-family:'Amiri',serif;font-size:13px;color:var(--gold);
  text-shadow:0 0 8px currentColor;
}
#tl-hl-dates{
  font-family:'Cairo',sans-serif;font-size:9px;color:rgba(201,168,76,.6);
}
#tl-track{
  position:relative;height:28px;cursor:crosshair;
}
/* Barre de fond */
#tl-bg{
  position:absolute;top:50%;left:0;right:0;height:2px;
  transform:translateY(-50%);
  background:rgba(201,168,76,.1);border-radius:1px;
}
/* Eras colorées */
#tl-eras{
  position:absolute;top:50%;left:0;right:0;height:2px;
  transform:translateY(-50%);
  display:flex;
}
/* Surbrillance narrateur sélectionné */
#tl-highlight{
  position:absolute;top:50%;height:6px;
  transform:translateY(-50%);border-radius:3px;
  background:var(--gold);
  box-shadow:0 0 12px var(--gold),0 0 24px rgba(201,168,76,.4);
  opacity:0;transition:all .5s cubic-bezier(.16,1,.3,1);
  pointer-events:none;
}
/* Label centré sur la plage */
#tl-hl-label{
  position:absolute;top:50%;transform:translateY(-220%);
  white-space:nowrap;pointer-events:none;
  opacity:0;transition:all .5s cubic-bezier(.16,1,.3,1);
  display:flex;flex-direction:column;align-items:center;gap:1px;
}
/* Curseur de survol */
#tl-cursor{
  position:absolute;top:0;bottom:0;width:1px;
  background:rgba(201,168,76,.25);pointer-events:none;
  opacity:0;transition:opacity .2s;
}
/* Marqueurs d'étoiles sur la timeline */
.tl-dot{
  position:absolute;top:50%;width:4px;height:4px;
  border-radius:50%;transform:translate(-50%,-50%);
  cursor:pointer;transition:all .15s;
  z-index:2;
}
.tl-dot:hover{transform:translate(-50%,-50%) scale(2);}
/* Labels d'ères */
#tl-labels{
  display:flex;justify-content:space-between;
  margin-top:5px;padding:0 0;
}
.tl-era-label{
  font-family:'Cairo',sans-serif;font-size:9px;
  color:rgba(201,168,76,.28);text-align:center;
  position:relative;
}
.tl-era-label::before{
  content:'';position:absolute;top:-8px;left:50%;
  width:1px;height:4px;background:rgba(201,168,76,.15);
}
/* Marqueur d'année au survol */
#tl-year-tip{
  position:absolute;bottom:calc(100% + 4px);
  background:rgba(0,5,8,.9);border:0.5px solid rgba(201,168,76,.2);
  border-radius:4px;padding:2px 7px;
  font-family:'Cairo',sans-serif;font-size:9px;color:rgba(201,168,76,.8);
  pointer-events:none;opacity:0;transition:opacity .15s;
  transform:translateX(-50%);white-space:nowrap;
}

/* ZOOM */
#zc{position:fixed;left:16px;top:50%;transform:translateY(-50%);z-index:20;display:flex;flex-direction:column;gap:5px;}
.zb{width:32px;height:32px;border-radius:7px;background:rgba(0,5,8,.82);border:0.5px solid rgba(201,168,76,.18);color:var(--gold);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;backdrop-filter:blur(8px);}
.zb:hover{background:rgba(201,168,76,.1);}
#zv{font-family:'Cairo',sans-serif;font-size:9px;color:rgba(201,168,76,.35);text-align:center;}

/* TOOLTIP */
#tt{position:fixed;z-index:25;background:rgba(0,5,8,.92);border:0.5px solid rgba(201,168,76,.2);border-radius:7px;padding:7px 11px;pointer-events:none;display:none;backdrop-filter:blur(10px);direction:rtl;}
#ttn{font-family:'Amiri',serif,'Traditional Arabic',serif;font-size:13px;color:var(--gold);}
#tts{font-family:'Cairo',sans-serif;font-size:9px;color:rgba(201,168,76,.4);margin-top:2px;}

/* LOADING */
#ld{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 1s;}
#ld h2{font-family:'Amiri',serif;font-size:40px;color:var(--gold);margin-bottom:6px;text-shadow:0 0 40px rgba(201,168,76,.5),0 0 80px rgba(201,168,76,.2);}
#ld p{font-family:'Cairo',sans-serif;font-size:11px;color:rgba(201,168,76,.3);letter-spacing:3px;margin-bottom:30px;}
.lbw{width:160px;height:1px;background:rgba(201,168,76,.08);}
.lbf{height:100%;background:var(--gold);width:0%;transition:width .4s;}
#lst{font-family:'Cairo',sans-serif;font-size:10px;color:rgba(201,168,76,.22);margin-top:10px;}

/* VIEW TOGGLE */
#vtoggle{position:fixed;top:14px;right:24px;z-index:25;display:flex;gap:5px;}
.vb{padding:5px 12px;border-radius:14px;background:rgba(0,5,8,.85);border:0.5px solid rgba(201,168,76,.18);color:rgba(201,168,76,.5);font-family:'Cairo',sans-serif;font-size:10px;cursor:pointer;transition:all .2s;backdrop-filter:blur(8px);}
.vb.on{background:rgba(201,168,76,.12);border-color:rgba(201,168,76,.4);color:var(--gold);}

/* HINT */
#hint{position:fixed;bottom:44px;left:50%;transform:translateX(-50%);z-index:5;text-align:center;pointer-events:none;transition:opacity 2s;}
#hint p{font-family:'Cairo',sans-serif;font-size:10px;color:rgba(201,168,76,.2);letter-spacing:1px;}
</style>
</head>
<body>

<div id="ld">
  <h2>سماء الحديث</h2>
  <p>SAMA AL-HADITH · ثلاثي الأبعاد</p>
  <div class="lbw"><div class="lbf" id="lbf"></div></div>
  <div id="lst">جارٍ التحميل...</div>
</div>

<div id="c"></div>

<div id="hdr">
  <div id="hdr-left">
    <h1>سماء الحديث</h1>
    <p>SAMA AL-HADITH · 3D</p>
  </div>
  <div style="display:flex;">
    <div class="hstat"><div class="hv" id="stn">—</div><div class="hl">ناقل</div></div>
    <div class="hstat"><div class="hv" id="stl">—</div><div class="hl">سند</div></div>
  </div>
</div>

<div id="sw">
  <input id="si" type="text" placeholder="ابحث عن راوٍ..." autocomplete="off">
  <div id="sr"></div>
</div>

<div id="vtoggle">
  <div class="vb on" id="vb3d" onclick="setView('3d')">3D</div>
  <div class="vb" id="vb2d" onclick="setView('2d')">2D</div>
</div>

<div id="panel">
  <div id="pcl" onclick="closePanel()">✕</div>
  <div id="ph">
    <div id="pg"><span class="pdot" id="pdot"></span><span id="pgt"></span></div>
    <div id="pn"></div>
    <div id="pl"></div>
  </div>
  <div id="pb"></div>
</div>

<div id="leg">
  <div class="li"><div class="ld" style="background:var(--sahabi);box-shadow:0 0 5px var(--sahabi)"></div><span class="ll">الصحابة</span></div>
  <div class="li"><div class="ld" style="background:var(--tabii);box-shadow:0 0 5px var(--tabii)"></div><span class="ll">التابعون</span></div>
  <div class="li"><div class="ld" style="background:var(--muhaddith);box-shadow:0 0 5px var(--muhaddith)"></div><span class="ll">المحدثون</span></div>
  <div class="li"><div class="ld" style="background:var(--rijal);box-shadow:0 0 5px var(--rijal)"></div><span class="ll">علماء الرجال</span></div>
</div>

<!-- Repère géographique vertical -->
<div id="geo-axis">
  <div id="geo-axis-title">الموقع الجغرافي</div>
  <div id="geo-track">
    <div id="geo-highlight"></div>
    <div id="geo-cursor"></div>
  </div>
</div>

<div id="zc">
  <button class="zb" onclick="doZoom(0.8)">+</button>
  <div id="zv">100%</div>
  <button class="zb" onclick="doZoom(1.25)">−</button>
  <button class="zb" onclick="resetCam()" style="font-size:12px;margin-top:3px;">↺</button>
</div>

<div id="ctrl">
  <button class="cb on" id="ba" onclick="setF('all')">الكل</button>
  <div class="csep"></div>
  <button class="cb" id="bs" onclick="setF('sahabi')">الصحابة</button>
  <button class="cb" id="bt" onclick="setF('tabii')">التابعون</button>
  <button class="cb" id="bm" onclick="setF('muhaddith')">المحدثون</button>
  <button class="cb" id="br" onclick="setF('rijal')">علماء الرجال</button>
  <div class="csep"></div>
  <button class="cb" id="bauto" onclick="toggleAuto()">⟳ دوران</button>
</div>

<div id="hint"><p>سحب أيسر للتحريك · سحب أيمن / Ctrl للتدوير · عجلة للتكبير · نقر على نجمة للتفاصيل</p></div>
<div id="tt"><div id="ttn"></div><div id="tts"></div></div>

<!-- TIMELINE -->
<div id="tl-wrap">
  <div id="tl-track">
    <div id="tl-bg"></div>
    <div id="tl-eras"></div>
    <div id="tl-highlight"></div>
    <div id="tl-hl-label">
      <span id="tl-hl-name"></span>
      <span id="tl-hl-dates"></span>
    </div>
    <div id="tl-cursor"></div>
    <div id="tl-year-tip"></div>
  </div>
  <div id="tl-labels"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
const SB='https://kiqzfwyzekduitxghwaa.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtpcXpmd3l6ZWtkdWl0eGdod2FhIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3NDQ0MzYxOSwiZXhwIjoyMDkwMDE5NjE5fQ.BQSVuoh62aDcSGYyKKQkfrie6BZFL-dpiunYvflyjLA';

const GC={sahabi:0xf5d77a,tabii:0x7ab8f5,muhaddith:0xc07af5,rijal:0x7af5c0};
const GCS={sahabi:'#f5d77a',tabii:'#7ab8f5',muhaddith:'#c07af5',rijal:'#7af5c0'};
const GL={sahabi:'صحابي',tabii:'تابعي',muhaddith:'محدّث',rijal:'ناقد رجال'};

let narrators=[],transmissions=[],hadiths=[];
let scene,camera,renderer,clock;
let starPoints,selLines,bgParticles;
let raycaster,mouse;
let selId=null,hovId=null,filter='all';
let autoRotate=false,view='3d';
let posMap={},idxMap={};
let labelDivs=[];

// CSS2D renderer (manual implementation without import)
const labelContainer=document.createElement('div');
labelContainer.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:10;overflow:hidden;';
labelContainer.setAttribute('dir','rtl');
document.body.appendChild(labelContainer);

function setLS(m,p){document.getElementById('lst').textContent=m;document.getElementById('lbf').style.width=p+'%';}

async function sbGet(t,q=''){
  const r=await fetch(SB+'/rest/v1/'+t+'?'+q,{headers:{'apikey':KEY,'Authorization':'Bearer '+KEY}});
  return r.json();
}

// ── World position ─────────────────────────────────────────────────────────────
let ERA_MIN=1,ERA_MAX=950;
const GEN_Z={sahabi:-120,tabii:-40,muhaddith:40,rijal:120};

// ── Mapping géographique → Y ──────────────────────────────────────────────────
// Basé sur la latitude réelle (nord=haut, sud=bas), normalisé sur [-150, +150]
// Latitude de référence : Médine ~24°N = centre (Y=0)
// Échelle : 1° de latitude ≈ 6 unités Y
const GEO_Y_MAP = [
  // Maghreb / Andalousie (37-35°N) → haut
  {keys:['الأندلس','أندلس','قرطبة','إشبيلية'],        y: 160},
  {keys:['المغرب','فاس','مراكش','القيروان','تونس'],    y: 140},
  // Levant / Syrie (33-34°N)
  {keys:['الشام','دمشق','سوريا','حلب','حمص','حماة'],  y: 110},
  // Irak (32-33°N)
  {keys:['بغداد','العراق'],                            y: 100},

function getGeoY(origin){
  if(!origin) return null;
  const o=origin.toLowerCase();
  for(const {keys,y} of GEO_Y_MAP){
    for(const k of keys){
      if(o.includes(k.toLowerCase())) return y;
    }
  }
  return null;
}

function getPos3D(n){
  const x=(((n.death_ah||1)-ERA_MIN)/(ERA_MAX-ERA_MIN))*400-200;
  const z=GEN_Z[n.generation]||0;
  const seed=(n.id*2654435761)>>>0;

  // Y géographique si possible, sinon hash déterministe dans bande centrale
  const geoY=getGeoY(n.origin);
  const baseY= geoY !== null ? geoY : ((seed%6000)/6000-0.5)*80;

  // Petite jitter pour éviter l'empilement exact de narrateurs au même lieu/époque
  const jx=((seed%997)/997-0.5)*20;
  const jy=((seed%503)/503-0.5)*18;
  const jz=((seed%1013)/1013-0.5)*20;

  return new THREE.Vector3(x+jx, baseY+jy, z+jz);
}

function getPos2D(n){
  const x=(((n.death_ah||1)-ERA_MIN)/(ERA_MAX-ERA_MIN))*400-200;
  const geoY=getGeoY(n.origin);
  const seed=(n.id*2654435761)>>>0;
  const baseY= geoY !== null ? geoY : ((seed%6000)/6000-0.5)*80;
  const jy=((seed%503)/503-0.5)*18;
  return new THREE.Vector3(x, baseY+jy, 0);
}
function getPos(n){return view==='3d'?getPos3D(n):getPos2D(n);}

function starSize(n){
  if(n.generation==='sahabi') return 4.5;
  if(n.hadith_count>10000) return 5;
  if(n.hadith_count>3000) return 3.8;
  if(n.hadith_count>800) return 3;
  return 2.2;
}

// ── Build star field ──────────────────────────────────────────────────────────
function buildStars(){
  const vis=narrators.filter(n=>filter==='all'||n.generation===filter);
  if(starPoints){scene.remove(starPoints);starPoints.geometry.dispose();}
  clearLabels();

  const geo=new THREE.BufferGeometry();
  const positions=new Float32Array(vis.length*3);
  const colors=new Float32Array(vis.length*3);
  const sizes=new Float32Array(vis.length);

  idxMap={};posMap={};

  vis.forEach((n,i)=>{
    const p=getPos(n);
    positions[i*3]=p.x;positions[i*3+1]=p.y;positions[i*3+2]=p.z;
    posMap[n.id]=p;idxMap[i]=n.id;
    const c=new THREE.Color(GC[n.generation]||0xc9a84c);
    colors[i*3]=c.r;colors[i*3+1]=c.g;colors[i*3+2]=c.b;
    sizes[i]=starSize(n);
  });

  geo.setAttribute('position',new THREE.BufferAttribute(positions,3));
  geo.setAttribute('aColor',new THREE.BufferAttribute(colors,3));
  geo.setAttribute('size',new THREE.BufferAttribute(sizes,1));

  const mat=new THREE.ShaderMaterial({
    uniforms:{
      uTime:{value:0},
      uSelected:{value:-1},
      uHovered:{value:-1}
    },
    vertexShader:`
      attribute float size;
      attribute vec3 aColor;
      varying vec3 vColor;
      varying float vIdx;
      uniform float uTime;
      uniform float uSelected;
      uniform float uHovered;
      void main(){
        vColor=aColor;
        float idx=float(gl_VertexID);
        vIdx=idx;
        float pulse=1.0;
        if(idx==uHovered||idx==uSelected){
          pulse=1.0+sin(uTime*6.0)*0.25;
        }
        vec4 mv=modelViewMatrix*vec4(position,1.0);
        float dist=length(mv.xyz);
        float attn=clamp(300.0/dist,0.4,4.0);
        float ps=size*pulse*attn*(idx==uSelected?2.2:(idx==uHovered?1.8:1.0));
        gl_PointSize=min(ps,40.0);
        gl_Position=projectionMatrix*mv;
      }
    `,
    fragmentShader:`
      varying vec3 vColor;
      varying float vIdx;
      uniform float uSelected;
      uniform float uHovered;
      uniform float uTime;
      void main(){
        vec2 uv=gl_PointCoord-0.5;
        float d=length(uv);
        if(d>0.5) discard;
        bool isSel=vIdx==uSelected;
        bool isHov=vIdx==uHovered;
        // Bloom multi-couche
        float core=1.0-smoothstep(0.0,0.10,d);
        float mid=1.0-smoothstep(0.0,0.28,d);
        float outer=1.0-smoothstep(0.0,0.5,d);
        float bloom=pow(1.0-d*2.0,3.0)*0.5; // bloom supplémentaire
        // Diffraction spikes — plus longs si sélectionné
        float spikeScale=isSel?24.0:isHov?20.0:18.0;
        float spike=0.0;
        float ax=abs(uv.x),ay=abs(uv.y);
        float diag1=abs(uv.x-uv.y),diag2=abs(uv.x+uv.y);
        spike+=max(0.0,1.0-ax*spikeScale)*max(0.0,1.0-ay*1.5)*0.7;
        spike+=max(0.0,1.0-ay*spikeScale)*max(0.0,1.0-ax*1.5)*0.7;
        spike+=max(0.0,1.0-diag1*(spikeScale*1.4))*max(0.0,1.0-diag2*1.5)*0.4;
        spike+=max(0.0,1.0-diag2*(spikeScale*1.4))*max(0.0,1.0-diag1*1.5)*0.4;
        // Pulse anneau si sélectionné
        float ring=0.0;
        if(isSel){
          float rd=abs(d-0.38);
          ring=max(0.0,1.0-rd*30.0)*0.5*(0.7+0.3*sin(uTime*4.0));
        }
        vec3 white=vec3(1.0,0.97,0.9);
        vec3 col=mix(vColor,white,core*0.9);
        // Légère teinte chaude sur bloom
        col+=vec3(0.05,0.03,0.0)*bloom*(isSel?2.0:1.0);
        float alpha=core+mid*0.55+outer*0.2+bloom*0.4+spike*0.55+ring;
        alpha=clamp(alpha,0.0,1.0);
        if(isSel||isHov) alpha=min(alpha*1.5,1.0);
        gl_FragColor=vec4(col,alpha);
      }
    `,
    transparent:true,
    depthWrite:false,
    blending:THREE.AdditiveBlending
  });

  starPoints=new THREE.Points(geo,mat);
  scene.add(starPoints);
}

// ── Labels ─────────────────────────────────────────────────────────────────────
function clearLabels(){
  labelDivs.forEach(d=>d.remove());
  labelDivs=[];
}
function updateLabels(){
  labelDivs.forEach(d=>d.remove());
  labelDivs=[];
  const vis=narrators.filter(n=>filter==='all'||n.generation===filter);
  const camDist=spherical.radius;

  // Seuils de zoom : labels uniquement quand assez proche
  // > 400 : aucun label   200-400 : sélection/survol seulement   < 200 : tous
  const showAll = camDist < 180;
  const showSome = camDist < 320;

  // Éviter la superposition : on trie par distance écran et on skip les proches
  const projected = [];
  vis.forEach(n=>{
    const isSpecial = n.id===selId||n.id===hovId;
    if(!isSpecial && !showSome) return;
    const p=posMap[n.id];if(!p) return;
    const v=p.clone().project(camera);
    if(v.z>1||v.z<-1) return;
    const sx=(v.x*0.5+0.5)*innerWidth;
    const sy=(-v.y*0.5+0.5)*innerHeight;
    if(sx<-50||sx>innerWidth+50||sy<-50||sy>innerHeight+50) return;
    projected.push({n, sx, sy, isSpecial});
  });

  // Anti-collision : skip si trop proche d'un label déjà placé
  const placed=[];
  const minDist = showAll ? 55 : 80;

  // Priorité : sélectionné > survolé > importants > reste
  projected.sort((a,b)=>{
    if(a.n.id===selId) return -1;
    if(b.n.id===selId) return 1;
    if(a.n.id===hovId) return -1;
    if(b.n.id===hovId) return 1;
    return (b.n.hadith_count||0)-(a.n.hadith_count||0);
  });

  projected.forEach(({n,sx,sy,isSpecial})=>{
    if(!isSpecial){
      const tooClose=placed.some(p=>Math.hypot(p.sx-sx,p.sy-sy)<minDist);
      if(tooClose) return;
    }
    placed.push({sx,sy});

    const isSel=n.id===selId, isHov=n.id===hovId;
    const opacity=isSel?1:isHov?0.9:showAll?0.55:0.7;
    const fontSize=isSel?14:isHov?12:10;
    const offsetY=isSel?22:isHov?20:16;

    const d=document.createElement('div');
    d.className='lbl';
    d.setAttribute('dir','rtl');
    d.textContent=n.name_ar;
    d.style.cssText=`position:absolute;left:${sx}px;top:${sy-offsetY}px;transform:translateX(-50%);opacity:${opacity};font-size:${fontSize}px;`;
    labelContainer.appendChild(d);
    labelDivs.push(d);
  });
}

function buildSelLines(narratorId){
  if(selLines){scene.remove(selLines);selLines.geometry.dispose();}
  const sel=narrators.find(n=>n.id===narratorId);
  if(!sel) return;
  const sp=posMap[sel.id];if(!sp) return;
  const pts=[];
  const cols=[];
  transmissions.forEach(t=>{
    let other=null;
    if(t.teacher_id===narratorId) other=narrators.find(n=>n.id===t.student_id);
    else if(t.student_id===narratorId) other=narrators.find(n=>n.id===t.teacher_id);
    if(!other||!posMap[other.id]) return;
    const op=posMap[other.id];
    pts.push(sp.x,sp.y,sp.z,op.x,op.y,op.z);
    const c=new THREE.Color(GC[other.generation]||0xc9a84c);
    const isTeacher=t.student_id===narratorId;
    const alpha=isTeacher?0.6:0.3;
    cols.push(c.r*alpha,c.g*alpha,c.b*alpha,c.r*0.1,c.g*0.1,c.b*0.1);
  });
  if(!pts.length) return;
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(pts),3));
  geo.setAttribute('color',new THREE.BufferAttribute(new Float32Array(cols),3));
  const mat=new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:0.7,blending:THREE.AdditiveBlending});
  selLines=new THREE.LineSegments(geo,mat);
  scene.add(selLines);
}

// ── Orbit controls (manual) ────────────────────────────────────────────────────
let isDragging=false,prevX=0,prevY=0;
let spherical,targetSpherical;
let tDist=0;
// Pan target — décalage du point de regard
let panTarget=new THREE.Vector3(0,0,0);
let panCurrent=new THREE.Vector3(0,0,0);

function initControls(){
  const el=renderer.domElement;
  // 0=none 1=orbit 2=pan
  let dragMode=0;

  el.addEventListener('contextmenu',e=>e.preventDefault());

  el.addEventListener('mousedown',e=>{
    prevX=e.clientX;prevY=e.clientY;
    // Clic gauche → pan  |  clic droit / Ctrl → orbite
    if(e.button===2||e.ctrlKey||e.shiftKey){
      dragMode=1; el.style.cursor='grabbing';
    } else {
      dragMode=2; el.style.cursor='move';
    }
    isDragging=true;
  });

  window.addEventListener('mouseup',()=>{
    isDragging=false; dragMode=0;
    el.style.cursor='grab';
  });

  window.addEventListener('mousemove',e=>{
    if(isDragging){
      const dx=e.clientX-prevX;
      const dy=e.clientY-prevY;
      if(dragMode===1){
        // Orbite
        targetSpherical.theta-=dx*0.005;
        targetSpherical.phi-=dy*0.005;
        targetSpherical.phi=Math.max(0.15,Math.min(Math.PI-0.15,targetSpherical.phi));
      } else if(dragMode===2){
        // Pan — déplacer le point de regard dans le plan caméra
        const panSpeed=targetSpherical.radius*0.001;
        // Vecteurs right et up de la caméra
        const right=new THREE.Vector3();
        const up=new THREE.Vector3();
        camera.getWorldDirection(new THREE.Vector3()); // force update
        right.setFromMatrixColumn(camera.matrix,0);
        up.setFromMatrixColumn(camera.matrix,1);
        panTarget.addScaledVector(right,-dx*panSpeed);
        panTarget.addScaledVector(up,dy*panSpeed);
      }
      prevX=e.clientX;prevY=e.clientY;
      return;
    }
    // Hover raycasting
    mouse.x=(e.clientX/innerWidth)*2-1;
    mouse.y=-(e.clientY/innerHeight)*2+1;
    if(starPoints){
      raycaster.setFromCamera(mouse,camera);
      const hits=raycaster.intersectObject(starPoints);
      const tt=document.getElementById('tt');
      if(hits.length){
        const idx=hits[0].index;
        const nid=idxMap[idx];
        hovId=nid;
        if(starPoints) starPoints.material.uniforms.uHovered.value=idx;
        const n=narrators.find(x=>x.id===nid);
        if(n){
          document.getElementById('ttn').textContent=n.name_ar;
          document.getElementById('tts').textContent=(n.death_ah||'?')+' هـ - '+(GL[n.generation]||n.generation)+(n.origin?' - '+n.origin:'');
          tt.style.display='block';
          tt.style.left=(e.clientX+12)+'px';
          tt.style.top=(e.clientY-8)+'px';
        }
        el.style.cursor='pointer';
      } else {
        hovId=null;
        if(starPoints) starPoints.material.uniforms.uHovered.value=-1;
        tt.style.display='none';
        el.style.cursor='grab';
      }
    }
  });

  el.addEventListener('click',e=>{
    if(Math.abs(e.clientX-prevX)+Math.abs(e.clientY-prevY)>5) return;
    if(e.button!==0) return;
    if(starPoints){
      mouse.x=(e.clientX/innerWidth)*2-1;
      mouse.y=-(e.clientY/innerHeight)*2+1;
      raycaster.setFromCamera(mouse,camera);
      const hits=raycaster.intersectObject(starPoints);
      if(hits.length){
        const n=narrators.find(x=>x.id===idxMap[hits[0].index]);
        if(n) openPanel(n);
      } else if(!document.getElementById('panel').contains(e.target)){
        closePanel();
      }
    }
  });

  el.addEventListener('wheel',e=>{
    e.preventDefault();
    targetSpherical.radius*=(e.deltaY>0?1.12:0.89);
    targetSpherical.radius=Math.max(30,Math.min(2000,targetSpherical.radius));
    updateZoomLabel();
  },{passive:false});

  // Touch — 1 doigt = orbite, 2 doigts = zoom + pan
  let touch2PrevMidX=0,touch2PrevMidY=0;
  el.addEventListener('touchstart',e=>{
    if(e.touches.length===1){
      isDragging=true; dragMode=1;
      prevX=e.touches[0].clientX;prevY=e.touches[0].clientY;
    } else if(e.touches.length===2){
      isDragging=false; dragMode=2;
      tDist=Math.hypot(
        e.touches[0].clientX-e.touches[1].clientX,
        e.touches[0].clientY-e.touches[1].clientY
      );
      touch2PrevMidX=(e.touches[0].clientX+e.touches[1].clientX)/2;
      touch2PrevMidY=(e.touches[0].clientY+e.touches[1].clientY)/2;
    }
  },{passive:true});

  el.addEventListener('touchmove',e=>{
    if(e.touches.length===1&&dragMode===1&&isDragging){
      const dx=e.touches[0].clientX-prevX;
      const dy=e.touches[0].clientY-prevY;
      targetSpherical.theta-=dx*0.005;
      targetSpherical.phi-=dy*0.005;
      targetSpherical.phi=Math.max(0.15,Math.min(Math.PI-0.15,targetSpherical.phi));
      prevX=e.touches[0].clientX;prevY=e.touches[0].clientY;
    } else if(e.touches.length===2){
      const d=Math.hypot(
        e.touches[0].clientX-e.touches[1].clientX,
        e.touches[0].clientY-e.touches[1].clientY
      );
      // Zoom
      targetSpherical.radius*=tDist/d;
      targetSpherical.radius=Math.max(30,Math.min(2000,targetSpherical.radius));
      tDist=d; updateZoomLabel();
      // Pan avec le point médian
      const midX=(e.touches[0].clientX+e.touches[1].clientX)/2;
      const midY=(e.touches[0].clientY+e.touches[1].clientY)/2;
      const dx=midX-touch2PrevMidX, dy=midY-touch2PrevMidY;
      const panSpeed=targetSpherical.radius*0.001;
      const right=new THREE.Vector3(); const up=new THREE.Vector3();
      right.setFromMatrixColumn(camera.matrix,0);
      up.setFromMatrixColumn(camera.matrix,1);
      panTarget.addScaledVector(right,-dx*panSpeed);
      panTarget.addScaledVector(up,dy*panSpeed);
      touch2PrevMidX=midX; touch2PrevMidY=midY;
    }
  },{passive:true});

  el.addEventListener('touchend',e=>{
    if(e.touches.length===0){isDragging=false;dragMode=0;}
    else if(e.touches.length===1){
      isDragging=true;dragMode=1;
      prevX=e.touches[0].clientX;prevY=e.touches[0].clientY;
    }
  },{passive:true});
}

function updateZoomLabel(){
  const pct=Math.round(350/Math.max(targetSpherical.radius,1)*100);
  document.getElementById('zv').textContent=pct+'%';
}
function doZoom(f){targetSpherical.radius*=f;targetSpherical.radius=Math.max(30,Math.min(2000,targetSpherical.radius));updateZoomLabel();}
function resetCam(){
  targetSpherical.set(350,Math.PI/2,0);
  panTarget.set(0,0,0);
  updateZoomLabel();
}

// ── Filter / View ──────────────────────────────────────────────────────────────
function setF(f){
  filter=f;
  ['all','sahabi','tabii','muhaddith','rijal'].forEach(k=>{
    const b=document.getElementById('b'+(k==='all'?'a':k[0]));
    if(b) b.classList.toggle('on',k===f);
  });
  buildStars();
  buildTimeline();
}

let autoOn=false;
function toggleAuto(){
  autoOn=!autoOn;
  document.getElementById('bauto').classList.toggle('on',autoOn);
}

function setView(v){
  view=v;
  document.getElementById('vb3d').classList.toggle('on',v==='3d');
  document.getElementById('vb2d').classList.toggle('on',v==='2d');
  if(v==='2d'){targetSpherical.set(targetSpherical.radius,Math.PI/2,0);}
  buildStars();
  if(selId) buildSelLines(selId);
}

// ── Search ─────────────────────────────────────────────────────────────────────
document.getElementById('si').addEventListener('input',function(){
  const q=this.value.trim();
  const sr=document.getElementById('sr');
  if(!q){sr.style.display='none';return;}
  const res=narrators.filter(n=>n.name_ar?.includes(q)||n.name_latin?.toLowerCase().includes(q.toLowerCase())).slice(0,10);
  if(!res.length){sr.style.display='none';return;}
  sr.innerHTML=res.map(n=>`<div class="sri" onclick="searchSelect(${n.id})"><span class="sri-n">${n.name_ar}</span><span class="sri-g" style="background:${GCS[n.generation]}18;color:${GCS[n.generation]};border:0.5px solid ${GCS[n.generation]}33">${GL[n.generation]}</span></div>`).join('');
  sr.style.display='block';
});
document.addEventListener('click',e=>{if(!document.getElementById('sw').contains(e.target)) document.getElementById('sr').style.display='none';});
function searchSelect(id){
  document.getElementById('sr').style.display='none';
  document.getElementById('si').value='';
  const n=narrators.find(x=>x.id===id);
  if(n) openPanel(n);
}

// ── Animate ────────────────────────────────────────────────────────────────────
function animate(){
  requestAnimationFrame(animate);
  const dt=clock.getDelta();
  const t=clock.getElapsedTime();

  // Smooth orbit
  spherical.theta+=(targetSpherical.theta-spherical.theta)*0.08;
  spherical.phi+=(targetSpherical.phi-spherical.phi)*0.08;
  spherical.radius+=(targetSpherical.radius-spherical.radius)*0.08;

  // Smooth pan
  panCurrent.lerp(panTarget,0.08);

  if(autoOn) targetSpherical.theta+=dt*0.15;

  camera.position.setFromSpherical(spherical);
  camera.position.add(panCurrent);
  camera.lookAt(panCurrent);

  // Rotation lente des particules de fond
  if(bgParticles) bgParticles.rotation.y=t*0.008;

  // Shader time
  if(starPoints) starPoints.material.uniforms.uTime.value=t;

  // Particules de chaîne isnad
  updateChainParticles();

  // Étoiles filantes
  maybeSpawnShootingStar(t);
  updateShootingStars(t);

  updateLabels();
  renderer.render(scene,camera);
}

function onResize(){
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
}

// ── REPÈRE GÉOGRAPHIQUE VERTICAL ─────────────────────────────────────────────
// Les villes-clés à afficher sur l'axe avec leur Y monde et leur importance
const GEO_AXIS_CITIES=[
  {name:'الأندلس',    y:160, major:false},
  {name:'المغرب',     y:140, major:false},
  {name:'الشام',      y:110, major:true},
  {name:'بغداد',      y:100, major:true},
  {name:'خراسان',     y:105, major:false},
  {name:'الكوفة',     y: 90, major:false},
  {name:'البصرة',     y: 75, major:true},
  {name:'مصر',        y: 40, major:true},
  {name:'المدينة',    y:-10, major:true},
  {name:'مكة',        y:-30, major:true},
  {name:'اليمن',      y:-110,major:true},
];

// Y monde → % sur l'axe visuel (Y min=-150, max=+170)
const GEO_Y_MIN=-150, GEO_Y_MAX=170;
function worldYtoPct(y){ return 1-(y-GEO_Y_MIN)/(GEO_Y_MAX-GEO_Y_MIN); }

function buildGeoAxis(){
  const track=document.getElementById('geo-track');
  // Supprimer les anciens labels/dots
  track.querySelectorAll('.geo-label,.geo-dot').forEach(e=>e.remove());

  GEO_AXIS_CITIES.forEach(city=>{
    const pct=worldYtoPct(city.y)*100;
    if(pct<0||pct>100) return;

    // Dot sur la ligne
    const dot=document.createElement('div');
    dot.className='geo-dot'+(city.major?' major':'');
    dot.style.top=pct+'%';
    track.appendChild(dot);

    // Label
    const lbl=document.createElement('div');
    lbl.className='geo-label';
    lbl.id='geo-lbl-'+city.name;
    lbl.setAttribute('dir','rtl');
    lbl.textContent=city.name;
    lbl.style.top=pct+'%';
    lbl.style.color=city.major?'rgba(201,168,76,.55)':'rgba(201,168,76,.3)';
    track.appendChild(lbl);
  });

  // Interactivité hover
  track.addEventListener('mousemove',geoHover);
  track.addEventListener('mouseleave',geoLeave);
}

function geoHover(e){
  const track=document.getElementById('geo-track');
  const rect=track.getBoundingClientRect();
  const pct=(e.clientY-rect.top)/rect.height;
  // Convertir en Y monde
  const worldY=GEO_Y_MIN+(1-pct)*(GEO_Y_MAX-GEO_Y_MIN);
  // Trouver la ville la plus proche
  const closest=GEO_AXIS_CITIES.reduce((best,c)=>{
    const d=Math.abs(c.y-worldY);
    return(!best||d<best.d)?{c,d}:best;
  },null);

  const cursor=document.getElementById('geo-cursor');
  cursor.style.top=pct*100+'%';
  cursor.style.opacity='1';

  // Highlight la ville proche
  document.querySelectorAll('.geo-label').forEach(l=>l.classList.remove('active'));
  if(closest&&closest.d<25){
    const lbl=document.getElementById('geo-lbl-'+closest.c.name);
    if(lbl) lbl.classList.add('active');
  }
}

function geoLeave(){
  document.getElementById('geo-cursor').style.opacity='0';
  document.querySelectorAll('.geo-label').forEach(l=>l.classList.remove('active'));
}

function updateGeoAxis(narrator){
  const hl=document.getElementById('geo-highlight');
  document.querySelectorAll('.geo-label').forEach(l=>l.classList.remove('active'));

  if(!narrator){
    hl.style.opacity='0';
    return;
  }

  const geoY=getGeoY(narrator.origin);
  if(geoY===null){hl.style.opacity='0';return;}

  const col=GCS[narrator.generation]||'#c9a84c';
  const pct=worldYtoPct(geoY)*100;

  // Highlight — barre centrée sur la position Y
  hl.style.top=(pct-1)+'%';
  hl.style.height='2%';
  hl.style.background=col;
  hl.style.boxShadow=`0 0 10px ${col}, 0 0 20px ${col}44`;
  hl.style.opacity='1';

  // Activer le label de la ville la plus proche
  const closest=GEO_AXIS_CITIES.reduce((best,c)=>{
    const d=Math.abs(c.y-geoY);
    return(!best||d<best.d)?{c,d}:best;
  },null);
  if(closest&&closest.d<30){
    const lbl=document.getElementById('geo-lbl-'+closest.c.name);
    if(lbl) lbl.classList.add('active');
  }
}

// ── TIMELINE ──────────────────────────────────────────────────────────────────
// TL_MIN et TL_MAX calculés dynamiquement après chargement des données
let TL_MIN=1, TL_MAX=950;

function computeTimelineRange(){
  const deaths=narrators.filter(n=>n.death_ah&&n.death_ah>0).map(n=>n.death_ah);
  if(!deaths.length) return;
  TL_MIN=Math.max(1, Math.min(...deaths)-10);
  TL_MAX=Math.max(...deaths)+10;
  // Arrondir aux dizaines pour des labels propres
  TL_MIN=Math.floor(TL_MIN/10)*10||1;
  TL_MAX=Math.ceil(TL_MAX/10)*10;
  // Synchroniser avec ERA_MIN/ERA_MAX pour le positionnement 3D
  ERA_MIN=TL_MIN;
  ERA_MAX=TL_MAX;
}
const ERAS=[
  {label:'عصر النبوة',start:1,end:11,col:'#f5d77a'},
  {label:'الصحابة',start:11,end:100,col:'#f5c040'},
  {label:'التابعون',start:100,end:180,col:'#7ab8f5'},
  {label:'أتباع التابعين',start:180,end:250,col:'#5090d0'},
  {label:'عصر التدوين',start:250,end:400,col:'#c07af5'},
  {label:'المحدثون',start:400,end:700,col:'#9050d0'},
  {label:'علماء الرجال',start:700,end:950,col:'#7af5c0'},
];

function tlPct(year){
  return Math.max(0,Math.min(1,(year-TL_MIN)/(TL_MAX-TL_MIN)))*100;
}

function buildTimeline(){
  const track=document.getElementById('tl-track');
  const W=track.clientWidth;

  // Eras background
  const erasEl=document.getElementById('tl-eras');
  erasEl.innerHTML='';
  ERAS.forEach(era=>{
    const left=tlPct(era.start);
    const width=tlPct(era.end)-left;
    const seg=document.createElement('div');
    seg.style.cssText=`flex:none;width:${width}%;background:${era.col}22;border-right:0.5px solid ${era.col}33;`;
    erasEl.appendChild(seg);
  });

  // Labels
  const labelsEl=document.getElementById('tl-labels');
  labelsEl.innerHTML='';
  // Générer des labels réguliers entre TL_MIN et TL_MAX
  const range=TL_MAX-TL_MIN;
  const step=range<=200?20:range<=400?50:range<=600?100:200;
  const firstLabel=Math.ceil(TL_MIN/step)*step;
  const years=[];
  for(let y=firstLabel;y<=TL_MAX;y+=step) years.push(y);
  years.forEach(y=>{
    const sp=document.createElement('span');
    sp.className='tl-era-label';
    sp.textContent=y+' هـ';
    sp.style.left=tlPct(y)+'%';
    sp.style.position='absolute';
    labelsEl.appendChild(sp);
  });
  labelsEl.style.position='relative';
  labelsEl.style.height='16px';

  // Dots pour chaque narrateur visible
  const oldDots=track.querySelectorAll('.tl-dot');
  oldDots.forEach(d=>d.remove());

  const vis=narrators.filter(n=>filter==='all'||n.generation===filter);
  vis.forEach(n=>{
    if(!n.death_ah) return;
    const dot=document.createElement('div');
    dot.className='tl-dot';
    dot.style.cssText=`left:${tlPct(n.death_ah)}%;background:${GCS[n.generation]};box-shadow:0 0 3px ${GCS[n.generation]};`;
    dot.title=n.name_ar;
    dot.addEventListener('click',()=>openPanel(n));
    track.appendChild(dot);
  });

  // Interactions hover sur la timeline
  track.addEventListener('mousemove',tlHover);
  track.addEventListener('mouseleave',tlLeave);
  track.addEventListener('click',tlClick);
}

function tlHover(e){
  const track=document.getElementById('tl-track');
  const rect=track.getBoundingClientRect();
  const x=e.clientX-rect.left;
  const pct=x/rect.width;
  const year=Math.round(TL_MIN+pct*(TL_MAX-TL_MIN));

  const cursor=document.getElementById('tl-cursor');
  cursor.style.left=x+'px';
  cursor.style.opacity='1';

  const tip=document.getElementById('tl-year-tip');
  tip.style.left=x+'px';
  tip.style.opacity='1';
  tip.textContent=year+' هـ';
}

function tlLeave(){
  document.getElementById('tl-cursor').style.opacity='0';
  document.getElementById('tl-year-tip').style.opacity='0';
}

function tlClick(e){
  // Clic sur la timeline → trouver le narrateur le plus proche de cette année
  const track=document.getElementById('tl-track');
  const rect=track.getBoundingClientRect();
  const pct=(e.clientX-rect.left)/rect.width;
  const year=TL_MIN+pct*(TL_MAX-TL_MIN);
  const vis=narrators.filter(n=>filter==='all'||n.generation===filter);
  const closest=vis.reduce((best,n)=>{
    if(!n.death_ah) return best;
    const d=Math.abs(n.death_ah-year);
    return (!best||d<best.d)?{n,d}:best;
  },null);
  if(closest&&closest.d<30) openPanel(closest.n);
}

function updateTimeline(narrator){
  const hl=document.getElementById('tl-highlight');
  const hlLabel=document.getElementById('tl-hl-label');
  const hlName=document.getElementById('tl-hl-name');
  const hlDates=document.getElementById('tl-hl-dates');

  if(!narrator){
    hl.style.opacity='0';
    hlLabel.style.opacity='0';
    return;
  }

  const col=GCS[narrator.generation]||'#c9a84c';

  // Estimer la naissance selon la génération
  const avgLife={sahabi:65,tabii:70,muhaddith:70,rijal:75};
  const lifespan=avgLife[narrator.generation]||70;
  const birthEst=narrator.death_ah?(narrator.death_ah-lifespan):null;

  const startYear=birthEst?Math.max(TL_MIN,birthEst):TL_MIN;
  const endYear=narrator.death_ah||TL_MAX;

  const leftPct=tlPct(startYear);
  const rightPct=tlPct(endYear);
  const widthPct=rightPct-leftPct;
  const centerPct=leftPct+widthPct/2;

  // Plage colorée
  hl.style.left=leftPct+'%';
  hl.style.width=widthPct+'%';
  hl.style.background=col;
  hl.style.boxShadow=`0 0 14px ${col}, 0 0 28px ${col}44`;
  hl.style.opacity='1';

  // Label centré sur la plage
  hlLabel.style.left=centerPct+'%';
  hlLabel.style.opacity='1';

  hlName.textContent=narrator.name_ar;
  hlName.style.color=col;
  hlName.style.textShadow=`0 0 10px ${col}`;

  const birthStr=birthEst?`${Math.max(0,birthEst)} هـ`:'؟';
  const deathStr=narrator.death_ah?`${narrator.death_ah} هـ`:'؟';
  hlDates.textContent=`${birthStr} — ${deathStr}`;
}

// ── Load & Boot ────────────────────────────────────────────────────────────────
async function loadData(){
  setLS('تحميل الرواة...',20);
  narrators=await sbGet('narrators','select=*&order=death_ah.asc&limit=1000');
  setLS('تحميل الأسانيد...',55);
  transmissions=await sbGet('transmissions','select=*&limit=5000');
  setLS('تحميل الأحاديث...',80);
  hadiths=await sbGet('hadiths','select=*&limit=2000');
  document.getElementById('stn').textContent=narrators.length;
  document.getElementById('stl').textContent=transmissions.length;
  setLS('بناء الكون ثلاثي الأبعاد...',92);
  await new Promise(r=>setTimeout(r,300));
  buildStars();
  computeTimelineRange();
  buildTimeline();
  buildGeoAxis();
  setLS('جاهز',100);
  await new Promise(r=>setTimeout(r,400));
  const ld=document.getElementById('ld');
  ld.style.opacity='0';
  setTimeout(()=>ld.style.display='none',1000);
  setTimeout(()=>{document.getElementById('hint').style.opacity='0';},5000);
}

window.onload = function() {
  if(typeof THREE === 'undefined') {
    document.getElementById('lst').textContent = 'خطأ: فشل تحميل Three.js - تحقق من الاتصال';
    document.getElementById('lbf').style.background = '#f57a7a';
    console.error('Three.js failed to load');
    return;
  }
  initThree();
  animate();
  loadData();
};
