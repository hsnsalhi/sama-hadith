const logEl=document.getElementById('log');
function ts(){return new Date().toLocaleTimeString('fr-FR');}
function log(msg,type='active'){const d=document.createElement('div');d.className='l '+type;d.innerHTML='<span class="t">['+ts()+']</span><span class="m">'+msg+'</span>';logEl.appendChild(d);logEl.scrollTop=logEl.scrollHeight;}
function ph(t){document.getElementById('phase').textContent=t;}
function setProg(p){document.getElementById('prog').style.width=Math.min(100,p)+'%';}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
async function api(method,path,body){
  const r=await fetch(API+path,{method,headers:{'PRIVATE-TOKEN':TOKEN,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  try{return{ok:r.ok,status:r.status,data:await r.json()};}catch{return{ok:r.ok,status:r.status,data:{}};}
}
async function pushFile(pid,path,b64,msg){
  let r=await api('PUT','/projects/'+pid+'/repository/files/'+encodeURIComponent(path),{branch:'main',content:b64,encoding:'base64',commit_message:msg});
  if(r.ok||r.status===200) return{ok:true,action:'updated'};
  let r2=await api('POST','/projects/'+pid+'/repository/files/'+encodeURIComponent(path),{branch:'main',content:b64,encoding:'base64',commit_message:msg});
  if(r2.ok||r2.status===201) return{ok:true,action:'created'};
  return{ok:false,err:JSON.stringify(r2.data).slice(0,100)};
}
async function run(){

  if(!me.ok){log('Erreur auth: '+me.status,'err');return;}
  log('Connecté: '+me.data.username,'ok');
  setProg(10);
  const proj=await api('GET','/projects/'+encodeURIComponent(me.data.username+'/sama-al-hadith'));
  if(!proj.ok){log('Repo introuvable','err');return;}
  const pid=proj.data.id;
  log('Repo: sama-al-hadith · id:'+pid,'ok');
  setProg(20);
  for(let i=0;i<FILES.length;i++){
    const f=FILES[i];
    ph('Push · '+f.path);
    log('Upload '+f.path+' ('+Math.round(f.b64.length*0.75/1024)+' KB)...','active');
    const r=await pushFile(pid,f.path,f.b64,f.msg);
    if(r.ok) log(f.path+' · '+r.action+' ✓','ok');
    else{log(f.path+' · ERREUR: '+r.err,'err');return;}
    setProg(20+Math.round((i+1)/FILES.length*65));
    await sleep(600);
  }
  await sleep(2000);
  const pipes=await api('GET','/projects/'+pid+'/pipelines?per_page=1');
  if(pipes.ok&&pipes.data[0]) log('Pipeline #'+pipes.data[0].id+' · '+pipes.data[0].status,'ok');
  const url='https://'+me.data.username+'.gitlab.io/sama-al-hadith/';
  document.getElementById('btn-site').href=url;
  document.getElementById('btn-pipe').href='https://gitlab.com/'+me.data.username+'/sama-al-hadith/-/pipelines';
  setProg(100);
  log('Déployé · disponible dans ~2 min · '+url,'ok');
  ph('Déployé ✓');
  document.getElementById('actions').classList.add('show');
}
run().catch(e=>log('Erreur: '+e.message,'err'));
</script>
</body>
</html>
