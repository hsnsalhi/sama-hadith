<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Agent Extraction Narrateurs · Isnad Parser</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#020d1f;font-family:'Segoe UI',system-ui,sans-serif;color:#c9a84c;min-height:100vh;padding:24px;}
h1{font-size:20px;font-weight:500;margin-bottom:4px;}
.sub{font-size:12px;color:rgba(201,168,76,.4);margin-bottom:20px;}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px;}
.sc{background:rgba(201,168,76,.07);border:0.5px solid rgba(201,168,76,.2);border-radius:10px;padding:12px;text-align:center;}
.sv{font-size:22px;font-weight:500;}
.sl{font-size:10px;color:rgba(201,168,76,.4);margin-top:4px;}
.pw{background:rgba(201,168,76,.08);border-radius:4px;height:5px;margin-bottom:16px;overflow:hidden;}
.pf{height:100%;background:#c9a84c;border-radius:4px;transition:width .4s;width:0%;}
.ph{display:inline-block;font-size:11px;padding:3px 12px;border-radius:20px;background:rgba(201,168,76,.1);border:0.5px solid rgba(201,168,76,.25);margin-bottom:12px;}
#log{background:#000913;border:0.5px solid rgba(201,168,76,.15);border-radius:10px;padding:14px;height:400px;overflow-y:auto;margin-bottom:14px;font-family:monospace;font-size:12px;}
.l{display:flex;gap:8px;line-height:1.85;}
.l .t{color:rgba(201,168,76,.2);min-width:80px;flex-shrink:0;}
.l.ok .m{color:#7af5c0;}
.l.err .m{color:#f57a7a;}
.l.info .m{color:#7ab8f5;}
.l.warn .m{color:#f5d07a;}
.l.dim .m{color:rgba(201,168,76,.2);}
.l.active .m{color:rgba(201,168,76,.9);}
.actions{display:none;gap:10px;flex-wrap:wrap;}
.actions.show{display:flex;}
.btn{flex:1;min-width:180px;padding:11px;background:rgba(201,168,76,.08);border:0.5px solid rgba(201,168,76,.35);border-radius:8px;color:#c9a84c;font-size:13px;cursor:pointer;text-align:center;text-decoration:none;display:block;transition:background .2s;}
.btn:hover{background:rgba(201,168,76,.18);}
.btn.p{background:rgba(201,168,76,.2);border-color:rgba(201,168,76,.6);font-weight:500;}
</style>
</head>
<body>
<h1>Agent Extraction · استخراج الرواة من الأسانيد</h1>
<p class="sub">Parse les chaînes d'isnad de 9 collections · extrait les noms uniques · insère dans Supabase</p>

<div class="stat-grid">
  <div class="sc"><div class="sv" id="s-col">0/9</div><div class="sl">Collections</div></div>
  <div class="sc"><div class="sv" id="s-parsed">0</div><div class="sl">Hadiths parsés</div></div>
  <div class="sc"><div class="sv" id="s-unique">0</div><div class="sl">Noms uniques</div></div>
  <div class="sc"><div class="sv" id="s-ins">0</div><div class="sl">Insérés</div></div>
</div>

<div class="pw"><div class="pf" id="prog"></div></div>
<div class="ph" id="phase">Initialisation...</div>
<div id="log"></div>
<div class="actions" id="actions">
  <a class="btn p" href="https://kiqzfwyzekduitxghwaa.supabase.co" target="_blank">Vérifier Supabase ↗</a>
  <div class="btn" onclick="location.reload()">Relancer ↺</div>
</div>

<script>
const SB='https://kiqzfwyzekduitxghwaa.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtpcXpmd3l6ZWtkdWl0eGdod2FhIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3NDQ0MzYxOSwiZXhwIjoyMDkwMDE5NjE5fQ.BQSVuoh62aDcSGYyKKQkfrie6BZFL-dpiunYvflyjLA';
const SBH={'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Prefer':'return=minimal'};
const CDN='https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions';

// Collections avec leurs métadonnées
const COLLECTIONS=[
  {id:'ara-bukhari1', name:'البخاري',    gen_hint:'muhaddith'},
  {id:'ara-muslim1',  name:'مسلم',       gen_hint:'muhaddith'},
  {id:'ara-abudawud1',name:'أبو داود',   gen_hint:'muhaddith'},
  {id:'ara-tirmidhi1',name:'الترمذي',    gen_hint:'muhaddith'},
  {id:'ara-nasai1',   name:'النسائي',    gen_hint:'muhaddith'},
  {id:'ara-ibnmajah1',name:'ابن ماجه',   gen_hint:'muhaddith'},
  {id:'ara-malik1',   name:'الموطأ',     gen_hint:'tabii'},
  {id:'ara-ahmad',    name:'مسند أحمد',  gen_hint:'muhaddith'},
  {id:'ara-darimi',   name:'الدارمي',    gen_hint:'muhaddith'},
];

// Mots à exclure du parsing (pas des noms de narrateurs)
const STOP_WORDS=new Set([
  'قال','قالت','قالوا','عن','حدثنا','حدثني','أخبرنا','أخبرني','سمعت','سمعنا',
  'ان','أن','أنه','أنها','إن','إنه','إنها','الله','رسول','النبي','الرسول',
  'صلى','عليه','وسلم','ﷺ','رضي','عنه','عنها','تعالى','سبحانه',
  'بن','بنت','أبو','أبي','ابن','ابنة','أم','مولى','مولاة',
  'كان','كانت','قد','في','من','على','إلى','له','لها','لهم',
  'ما','لا','هذا','هذه','ذلك','تلك','وهو','وهي','وهم',
]);

// Patterns pour extraire les noms des chaînes d'isnad
// Pattern: حدثنا/أخبرنا/عن [NOM] (بن [NOM])? 
function extractNamesFromIsnad(text) {
  if(!text) return [];
  const names = new Set();
  
  // Pattern 1: "حدثنا X" / "أخبرنا X" / "حدثني X"
  const p1 = /(?:حدثنا|حدثني|أخبرنا|أخبرني|سمعت|سمعنا)\s+([\u0600-\u06FF]+(?:\s+بن\s+[\u0600-\u06FF]+)?(?:\s+بن\s+[\u0600-\u06FF]+)?)/g;
  for(const m of text.matchAll(p1)) {
    const name = m[1].trim();
    if(name.length > 3 && !STOP_WORDS.has(name.split(' ')[0])) names.add(name);
  }
  
  // Pattern 2: "عن X بن Y" (plus fiable pour les narrateurs intermédiaires)
  const p2 = /عن\s+([\u0600-\u06FF]+\s+بن\s+[\u0600-\u06FF]+(?:\s+بن\s+[\u0600-\u06FF]+)?)/g;
  for(const m of text.matchAll(p2)) {
    const name = m[1].trim();
    if(name.length > 5) names.add(name);
  }
  
  // Pattern 3: "عن أبي X" / "عن أبو X"
  const p3 = /عن\s+(أب[يو]\s+[\u0600-\u06FF]+(?:\s+[\u0600-\u06FF]+)?)/g;
  for(const m of text.matchAll(p3)) {
    const name = m[1].trim();
    if(name.length > 4) names.add(name);
  }

  return [...names].filter(n => n.length >= 4 && n.length <= 60);
}

// Normaliser un nom (supprimer diacritiques)
function normName(s) {
  return s
    .replace(/[\u064B-\u065F\u0670]/g,'')
    .replace(/أ|إ|آ/g,'ا')
    .replace(/ة/g,'ه')
    .replace(/ى/g,'ي')
    .trim();
}

// Deviner la génération depuis le contexte
function guessGeneration(name, collectionHint) {
  const n = name.toLowerCase();
  // Sahaba connus patterns
  if(n.includes('الصحابي') || n.includes('رضي الله عنه')) return 'sahabi';
  return 'tabii'; // défaut conservateur
}

// Deviner la collection associée
function collectionFor(colName) {
  return [colName];
}

const logEl=document.getElementById('log');
let step=0;
function ts(){return new Date().toLocaleTimeString('fr-FR');}
function log(msg,type='active'){
  const d=document.createElement('div');d.className='l '+type;
  d.innerHTML='<span class="t">['+ts()+']</span><span class="m">'+msg+'</span>';
  logEl.appendChild(d);logEl.scrollTop=logEl.scrollHeight;
}
function ph(t){document.getElementById('phase').textContent=t;}
function st(id,v){document.getElementById('s-'+id).textContent=v;}
function setProg(p){document.getElementById('prog').style.width=Math.min(100,p)+'%';}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

async function sbGet(table,qs=''){
  const r=await fetch(SB+'/rest/v1/'+table+'?'+qs,{headers:{'apikey':KEY,'Authorization':'Bearer '+KEY}});
  try{return{ok:r.ok,data:await r.json()};}catch{return{ok:false,data:[]};}
}
async function sbPost(table,data){
  const r=await fetch(SB+'/rest/v1/'+table,{method:'POST',headers:SBH,body:JSON.stringify(data)});
  return{ok:r.ok,status:r.status};
}

async function run(){
  log('Agent démarré · extraction des noms depuis les isnads arabes','info');
  await sleep(300);

  // 1. Charger les noms existants pour déduplication
  ph('Étape 1 · Chargement des noms existants');
  log('Lecture des narrateurs existants...','active');
  const existR=await sbGet('narrators','select=name_ar&limit=2000');
  const existingNorms=new Set();
  if(existR.ok&&Array.isArray(existR.data)){
    existR.data.forEach(n=>existingNorms.add(normName(n.name_ar)));
  }
  log(existingNorms.size+' narrateurs existants indexés','ok');
  await sleep(200);

  // 2. Parcourir chaque collection
  const allExtracted = new Map(); // normName → {name_ar, collections, count}
  let totalParsed=0, colDone=0;

  for(const col of COLLECTIONS){
    colDone++;
    st('col',colDone+'/'+COLLECTIONS.length);
    ph('Chargement · '+col.name);
    log('Téléchargement de '+col.name+'...','active');

    try{
      const r=await fetch(`${CDN}/${col.id}.min.json`);
      if(!r.ok){log(col.name+' · erreur HTTP '+r.status,'err');continue;}
      const data=await r.json();

      // Extraire tous les hadiths
      let hadiths=data.hadiths||[];
      if(!hadiths.length&&data.sections){
        Object.values(data.sections).forEach(s=>{
          if(s.hadiths) hadiths.push(...s.hadiths);
        });
      }

      log(col.name+' · '+hadiths.length+' hadiths · parsing des isnads...','active');
      let colExtracted=0;

      for(const h of hadiths){
        const text=h.text||'';
        if(!text) continue;
        totalParsed++;

        // Extraire les noms de l'isnad (début du hadith avant le matn)
        // L'isnad est généralement dans les 200 premiers caractères
        const isnadPart=text.slice(0,300);
        const names=extractNamesFromIsnad(isnadPart);

        names.forEach(name=>{
          const norm=normName(name);
          if(norm.length<4) return;
          if(existingNorms.has(norm)) return; // déjà en base

          if(!allExtracted.has(norm)){
            allExtracted.set(norm,{
              name_ar:name,
              norm,
              collections:[col.name],
              count:1,
              gen_hint:col.gen_hint
            });
          } else {
            const e=allExtracted.get(norm);
            e.count++;
            if(!e.collections.includes(col.name)) e.collections.push(col.name);
          }
          colExtracted++;
        });

        st('parsed',totalParsed.toLocaleString());
        st('unique',allExtracted.size.toLocaleString());
      }

      log(col.name+' · '+colExtracted+' noms extraits · total unique: '+allExtracted.size,'ok');
      setProg(Math.round(colDone/COLLECTIONS.length*70));
      await sleep(200);

    } catch(e){
      log(col.name+' · erreur: '+e.message,'err');
    }
  }

  log('Extraction terminée · '+allExtracted.size+' noms uniques non présents en base','ok');
  await sleep(300);

  // 3. Filtrer : garder seulement les noms qui apparaissent dans au moins 2 hadiths
  // (filtre qualité — évite les fautes de parsing)
  ph('Étape 3 · Filtrage qualité');
  log('Filtrage des noms (min. 2 occurrences)...','active');

  const toInsert=[];
  for(const [norm,data] of allExtracted){
    if(data.count<2) continue; // trop rare = probablement une erreur
    if(data.name_ar.length<4||data.name_ar.length>80) continue;

    // Deviner la génération selon les collections où il apparaît
    let gen='tabii';
    if(data.collections.some(c=>c.includes('الموطأ'))) gen='tabii';
    if(data.count>20) gen='tabii'; // narrateurs fréquents = souvent tabi'un

    toInsert.push({
      name_ar:data.name_ar,
      name_latin:'',
      death_ah:null,
      generation:gen,
      hadith_count:data.count*10, // estimation approximative
      origin:'',
      reliability:'',
      collections:data.collections
    });
  }

  log(toInsert.length+' narrateurs retenus après filtrage','ok');
  await sleep(200);

  // 4. Insérer par batches de 50
  ph('Étape 4 · Insertion dans Supabase');
  log('Insertion de '+toInsert.length+' narrateurs...','active');

  let inserted=0, errors=0;
  for(let i=0;i<toInsert.length;i+=50){
    const batch=toInsert.slice(i,i+50);
    const r=await sbPost('narrators',batch);
    if(r.ok||r.status===201||r.status===409){
      inserted+=batch.length;
      log('Batch '+(Math.floor(i/50)+1)+'/'+Math.ceil(toInsert.length/50)+' · '+inserted+' insérés ✓','ok');
    } else {
      errors+=batch.length;
      log('Batch '+(Math.floor(i/50)+1)+' · erreur '+r.status,'err');
    }
    st('ins',inserted);
    setProg(70+Math.round(inserted/toInsert.length*28));
    await sleep(80);
  }

  // 5. Résultat
  const finalR=await sbGet('narrators','select=count');
  const total=finalR.ok&&finalR.data[0]?finalR.data[0].count:'?';

  setProg(100);
  log('','dim');
  log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━','dim');
  log(totalParsed.toLocaleString()+' hadiths parsés · '+allExtracted.size+' noms extraits · '+inserted+' insérés','ok');
  log('Total en base : '+total+' narrateurs','ok');
  if(errors>0) log(errors+' erreurs','warn');
  log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━','dim');
  ph('Terminé ✓ · '+total+' narrateurs en base');
  document.getElementById('actions').classList.add('show');
}

run().catch(e=>log('Erreur fatale: '+e.message,'err'));
</script>
</body>
</html>
